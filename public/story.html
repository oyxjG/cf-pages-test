<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>故事花园 - 沉浸式阅读</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        :root {
            /* 复制核心配色变量，确保独立运行不依赖 */
            --bg-grad: linear-gradient(135deg, #111827 0%, #030712 100%);
            --card-bg: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent: #ef8b57;
            --accent-soft: rgba(239, 139, 87, 0.2);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        /* 浅色主题兼容 */
        [data-theme="light"] {
            --bg-grad: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 0, 0, 0.06);
            --accent: #bf5b32;
            --accent-soft: rgba(191, 91, 50, 0.1);
            --text-main: #111827;
            --text-muted: #6b7280;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", sans-serif;
            background: var(--bg-grad);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* 顶部导航 Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 99px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .back-btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            transform: translateX(-2px);
        }

        .logo-text {
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* 阅读进度条 */
        .progress-indicator {
            position: absolute;
            bottom: -2px;
            left: 0;
            height: 3px;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), #f472b6);
            transition: width 0.1s ease-out;
        }

        /* 阅读容器居中排版 */
        .container {
            max-width: 760px;
            width: 100%;
            margin: 110px auto 80px;
            padding: 0 20px;
            flex: 1;
        }

        /* 文章头部 */
        .article-header {
            text-align: center;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 24px;
            margin-bottom: 36px;
        }

        .article-title {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 900;
            line-height: 1.25;
            margin: 0 0 12px;
            letter-spacing: -0.02em;
        }

        .article-meta {
            font-size: 0.875rem;
            color: var(--text-muted);
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        /* Markdown 正文内容排版 */
        .article-content {
            font-size: var(--article-font-size, 1.125rem); /* 18px */
            line-height: 1.95;
            letter-spacing: 0.02em;
            color: var(--text-main);
            text-align: justify;
        }

        .article-content p {
            margin: 0 0 24px;
        }

        .article-content h1,
        .article-content h2,
        .article-content h3 {
            color: var(--accent);
            margin: 40px 0 20px;
            font-weight: 800;
            line-height: 1.3;
        }
        .article-content h1 { font-size: 1.6rem; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .article-content h2 { font-size: 1.4rem; }
        .article-content h3 { font-size: 1.25rem; }

        .article-content blockquote {
            margin: 32px 0;
            padding: 16px 24px;
            border-left: 4px solid var(--accent);
            background: var(--accent-soft);
            border-radius: 0 16px 16px 0;
            font-style: italic;
            color: var(--text-main);
        }

        .article-content strong {
            color: var(--accent);
            font-weight: 700;
        }

        /* 划词高亮与气泡 */
        .quote-action-bubble {
            position: absolute;
            z-index: 10000;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            padding: 8px 16px;
            border-radius: 99px;
            font-size: 0.8125rem;
            font-weight: 700;
            color: var(--accent);
            cursor: pointer;
            transition: all 0.15s ease;
            transform: translate(-50%, -100%) scale(1);
            transform-origin: bottom center;
            animation: bubble-pop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            user-select: none;
        }
        .quote-action-bubble::after {
            content: "";
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: var(--card-bg) transparent transparent;
            display: block;
            width: 0;
        }
        .quote-action-bubble:hover {
            transform: translate(-50%, -100%) scale(1.05);
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }
        .quote-action-bubble:hover::after {
            border-color: var(--accent) transparent transparent;
        }

        @keyframes bubble-pop {
            from { transform: translate(-50%, -85%) scale(0.8); opacity: 0; }
            to { transform: translate(-50%, -100%) scale(1); opacity: 1; }
        }

        /* Toast Container */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 12px 24px;
            border-radius: 16px;
            color: var(--text-main);
            font-size: 0.875rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: toast-in 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: opacity 0.3s, transform 0.3s;
        }
        
        .toast.fade-out {
            opacity: 0;
            transform: translateY(8px);
        }

        @keyframes toast-in {
            from { transform: translateY(24px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .empty-tips {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        /* 护眼绿豆沙模式 */
        [data-theme="eye-care"] {
            --bg-grad: linear-gradient(135deg, #f0f7f4 0%, #e1efe6 100%);
            --card-bg: rgba(255, 255, 255, 0.75);
            --border-color: rgba(0, 0, 0, 0.05);
            --accent: #2e7d32;
            --accent-soft: rgba(46, 125, 50, 0.1);
            --text-main: #1f3a24;
            --text-muted: #53765c;
        }

        /* 复古羊皮纸模式 */
        [data-theme="sepia"] {
            --bg-grad: linear-gradient(135deg, #fbf0df 0%, #f4e3c9 100%);
            --card-bg: rgba(255, 255, 255, 0.75);
            --border-color: rgba(0, 0, 0, 0.05);
            --accent: #8d5b1b;
            --accent-soft: rgba(141, 91, 27, 0.1);
            --text-main: #3e2f1e;
            --text-muted: #725d48;
        }

        /* 深色模式强制适配 */
        [data-theme="dark"] {
            --bg-grad: linear-gradient(135deg, #111827 0%, #030712 100%);
            --card-bg: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent: #ef8b57;
            --accent-soft: rgba(239, 139, 87, 0.2);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        /* 悬浮控制面板样式 */
        .reading-settings-wrapper {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
        }

        .settings-toggle-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            outline: none;
        }
        .settings-toggle-btn:hover {
            transform: scale(1.1) rotate(45deg);
            border-color: var(--accent);
            color: var(--accent);
        }

        .settings-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            padding: 20px;
            width: 280px;
            display: none;
            flex-direction: column;
            gap: 16px;
            animation: panel-show 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: right bottom;
        }
        .settings-panel.active {
            display: flex;
        }

        @keyframes panel-show {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .setting-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* 主题选项列表 */
        .theme-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .theme-opt-btn {
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            padding: 8px 4px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .theme-opt-btn:hover {
            background: var(--accent-soft);
            border-color: var(--accent);
        }
        .theme-opt-btn.active {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        /* 字体缩放控制 */
        .font-scale-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.1);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }
        [data-theme="light"] .font-scale-control {
            background: rgba(0, 0, 0, 0.03);
        }

        .font-btn {
            border: none;
            background: none;
            color: var(--text-main);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .font-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        [data-theme="light"] .font-btn:hover {
            background: rgba(0, 0, 0, 0.05);
        }
        
        .font-size-text {
            font-size: 0.875rem;
            font-weight: 700;
        }

        /* 自动滚动控制 */
        .scroll-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .scroll-toggle-btn {
            flex: 1;
            border: 1px solid var(--border-color);
            background: var(--accent-soft);
            color: var(--accent);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.8125rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .scroll-toggle-btn:hover {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }
        .scroll-toggle-btn.scrolling {
            background: #ef4444;
            color: #ffffff;
            border-color: #ef4444;
        }

        .scroll-speed-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1.2;
        }

        .scroll-speed-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 99px;
            background: var(--border-color);
            outline: none;
        }
        .scroll-speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .scroll-speed-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* 故事大厅样式 */
        .stories-hall {
            animation: hall-fade-in 0.4s ease;
        }
        @keyframes hall-fade-in {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hall-header {
            text-align: center;
            margin-bottom: 48px;
        }
        .hall-title {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent), #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 12px;
            letter-spacing: -0.02em;
        }
        .hall-subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            margin: 0;
            font-weight: 500;
        }
        .hall-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }
        .hall-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .hall-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, var(--accent-soft) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 0;
            pointer-events: none;
        }
        .hall-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent);
            box-shadow: 0 12px 30px rgba(239, 139, 87, 0.12);
        }
        [data-theme="light"] .hall-card:hover {
            box-shadow: 0 12px 30px rgba(191, 91, 50, 0.08);
        }
        .hall-card:hover::before {
            opacity: 0.8;
        }
        .hall-card-title {
            font-size: 1.125rem;
            font-weight: 800;
            color: var(--text-main);
            z-index: 1;
            margin: 0;
            transition: color 0.2s;
        }
        .hall-card:hover .hall-card-title {
            color: var(--accent);
        }
        .hall-card-desc {
            font-size: 0.875rem;
            line-height: 1.6;
            color: var(--text-muted);
            flex-grow: 1;
            z-index: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-align: justify;
        }
        .hall-card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            margin-top: 8px;
            z-index: 1;
        }
    </style>
</head>
<body>
    <header>
        <a href="/index.html" class="back-btn" id="back-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span id="back-btn-text">返回主页</span>
        </a>
        <div class="logo-text">故事花园 · 沉浸阅读</div>
        <div style="width: 100px;"></div> <!-- 占位保持左右平衡 -->
        <div class="progress-indicator" id="progress-bar"></div>
    </header>

    <main class="container">
        <article id="article-body">
            <!-- JS 渲染 -->
            <div class="empty-tips">正在加载故事内容中...</div>
        </article>
    </main>

    <!-- 自由划词收藏浮动气泡 -->
    <div class="quote-action-bubble" id="quote-select-bubble" style="display: none;">
        ❤️ 收藏至一言
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="theme.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const articleBody = document.getElementById('article-body');
            const selectBubble = document.getElementById('quote-select-bubble');
            const progressBar = document.getElementById('progress-bar');
            const toastContainer = document.getElementById('toast-container');

            let currentStoryTitle = '';
            let selectedQuoteText = '';

            // 1. 获取 URL 故事 ID
            const urlParams = new URLSearchParams(window.location.search);
            const storyId = urlParams.get('id');
            const backBtn = document.getElementById('back-btn');
            const backBtnText = document.getElementById('back-btn-text');
            const readingSettings = document.querySelector('.reading-settings-wrapper');

            if (!storyId) {
                // 大厅列表模式：自适应调整
                if (backBtn) backBtn.href = '/index.html';
                if (backBtnText) backBtnText.innerText = '返回首页';
                if (readingSettings) readingSettings.style.display = 'none';
                if (progressBar) progressBar.style.display = 'none';
                loadStoriesHall();
            } else {
                // 单篇文章阅读模式
                if (backBtn) backBtn.href = '/story.html';
                if (backBtnText) backBtnText.innerText = '返回大厅';
                // loadStory 将在后面定义后执行，此处由于 JS 函数提升可直接调用
                loadStory();
            }

            // 3. 极简 Regex Markdown 解析函数
            function parseMarkdown(md) {
                if (!md) return '';
                // 1. 临时占位引用语法开头的 >，防止其被转义为 &gt;
                let html = md.replace(/^>(?:[ \t]+(.*))?$/gm, '__BLOCKQUOTE_PREFIX__$1');

                // 2. 转义特殊字符，防御 XSS 攻击
                html = html
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");

                // 3. 渲染标题与水平分割线 (--- / *** / ___)
                html = html.replace(/^# (.*?)$/gm, '<h1>$1</h1>');
                html = html.replace(/^## (.*?)$/gm, '<h2>$1</h2>');
                html = html.replace(/^### (.*?)$/gm, '<h3>$1</h3>');
                html = html.replace(/^[-*_]{3,}$/gm, '<hr>');

                // 4. 合并连续的引用行并渲染为同一个 <blockquote>
                html = html.replace(/(?:^__BLOCKQUOTE_PREFIX__(.*?)(?:\r?\n|$))+/gm, (match) => {
                    const lines = match.split(/\r?\n/);
                    const innerContents = [];
                    lines.forEach(line => {
                        if (line.startsWith('__BLOCKQUOTE_PREFIX__')) {
                            innerContents.push(line.replace(/^__BLOCKQUOTE_PREFIX__/, ''));
                        }
                    });
                    
                    const processedLines = innerContents.map(content => {
                        let clean = content;
                        if (clean.endsWith('\\')) {
                            clean = clean.slice(0, -1) + '<br>';
                        }
                        return clean;
                    });

                    // 精准处理换行符拼接，避免由于前一行带有 \ 导致多余的 <br><br>
                    let mergedContent = '';
                    processedLines.forEach((line, index) => {
                        mergedContent += line;
                        if (index < processedLines.length - 1) {
                            if (!line.endsWith('<br>')) {
                                mergedContent += '<br>';
                            }
                        }
                    });
                    return `<blockquote>${mergedContent}</blockquote>\n`;
                });

                // 5. 渲染行内样式：加粗和斜体
                html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');

                // 6. 按行拆分，对非结构性标签行包裹 <p>，排除 <hr> 和 <blockquote>
                const lines = html.split('\n');
                const processed = lines.map(line => {
                    const trimmed = line.trim();
                    if (trimmed.length === 0) return '';
                    if (
                        trimmed.startsWith('<h') || 
                        trimmed.startsWith('<blockquote') || 
                        trimmed.startsWith('</blockquote') || 
                        trimmed.startsWith('<hr')
                    ) {
                        return line;
                    }

                            author: "詹姆斯·霍根",
                            content: `# 星之继承者：月球背面的五万年沉睡\n\n> 那些遥望星空的人，早已把他们的一部分灵魂留在了群星之中。\n\n### 一、冷寂尘埃中的奇迹\n在月球死寂荒凉的第谷环形山深处，太阳的光芒永远以极其锋利的明暗交界线切割着灰白色的月壤。公元2028年秋，国际联合月球科考队的钻探作业引发了一场微小的月震，在一处古老的玄武岩裂隙之下，深埋的金属反光刺破了数十亿年的沉寂。\n\n科考队员们小心翼翼地清理掉覆盖在表层的月尘，映入眼帘的，竟是一具身着鲜红色宇航服的人类遗骸。\n\n他的面罩早已被岁月的微陨石击穿，面部覆盖着一层薄薄的凝霜，但体态完整。遗骸被命名为“查理”。最令人匪夷所思的不是他的存在，而是碳-14与地质岩层的测定结果：**这名宇航员死于整整五万年以前。**\n\n### 二、超越时间的基因密码\n五万年前，地球上的智人刚刚走出非洲，手里握着的还是粗糙的燧石长矛与兽骨。然而在三十八万公里之外的月球上，一个身穿重型维生宇航服的生命却在这里静静长眠。\n\n人类生物学与基因测序中心对查理残留的骨骼组织展开了夜以继日的精密化验。报告得出的结论震撼了全球：\n- 他的染色体数目为 46 条；\n- 他的血红蛋白、肌红蛋白与器官分子结构，与现代人类的重合度高达 **99.98%**；\n- 他是一个地地道道的人类。\n\n他并非来自某个遥远的外星种族，也并非来自未来的时空穿越者。他那五万年前的心脏，曾跳动在与我们完全相同的人类胸膛中。\n\n### 三、遗落文明的星际信标\n在查理身边散落的金属仪器中，破译专家团队终于解读了一份被石英晶体锁存的微弱脉冲日志。\n\n那是关于一个古老太阳系文明的最后绝唱。五万年前，存在于火星与木星之间的母星遭遇了不可逆转的引力潮汐撕裂。面对席卷整个内太阳系的星际浩劫，最后一支名为“慧神星”的开拓舰队将人类基因火种与文明种子投向了这颗蔚蓝色的第三行星——地球。\n\n而查理，正是最后一位负责在月球轨道引导信标、掩护火种降落的守望者。\n\n### 四、我们所继承的宇宙\n> “当你在夜晚仰望浩瀚星河时，不要感到孤独与渺小。因为你身体里的每一个原子，都曾锻造于超新星的熔炉；而你眼中对未知的渴望，正是五万年前那双凝望地球的眼睛的延续。”\n\n文明不仅是生存的延续，更是对未知永恒的求索。我们并非这片大地的初来者，我们是跨越了五万年风沙与烈火的星之继承者。`,

            const startAutoScroll = () => {
                if (scrollInterval) clearInterval(scrollInterval);
                
                const speedVal = parseInt(scrollSpeedSlider.value) || 3;
                const intervalTime = Math.max(5, 70 - (speedVal * 6));

                scrollInterval = setInterval(() => {

                });
