<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 个人聚合面板</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --primary: #6366f1;
            --danger: #ef4444;
            --success: #22c55e;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        aside {
            width: 260px;
            background: var(--panel);
            border-right: 1px solid rgba(255,255,255,0.05);
            padding: 2rem;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 3rem;
        }

        .nav-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin: 1.5rem 0 0.75rem 1rem;
            opacity: 0.5;
        }

        nav {
            flex: 1;
            overflow-y: auto;
        }

        nav a {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 12px;
            margin-bottom: 0.5rem;
            transition: all 0.2s;
            font-size: 0.9375rem;
        }

        nav a:hover {
            color: var(--text);
            background: rgba(255,255,255,0.05);
        }

        nav a.active {
            background: var(--primary);
            color: white;
        }

        .nav-icon {
            margin-right: 0.75rem;
            opacity: 0.7;
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 2rem 3rem;
            overflow-y: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--panel);
            padding: 1.5rem;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stat-card span { color: var(--text-muted); font-size: 0.875rem; }
        .stat-card h3 { margin: 0.5rem 0 0; font-size: 1.5rem; }

        /* Table */
        .table-container {
            background: var(--panel);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 1rem 1.5rem;
            background: rgba(0,0,0,0.2);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        td {
            padding: 1rem 1.5rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 0.875rem;
        }

        .badge {
            padding: 0.25rem 0.625rem;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-success { background: rgba(34, 197, 94, 0.1); color: var(--success); }
        .badge-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

        .btn-action {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
            margin-right: 0.5rem;
        }

        .btn-action:hover { background: rgba(255,255,255,0.1); }
        .btn-delete { color: var(--danger); border-color: rgba(239, 68, 68, 0.2); }

        .loading { text-align: center; padding: 3rem; color: var(--text-muted); }
    </style>
</head>
<body>
    <aside>
        <div class="logo">ADMIN PANEL</div>
        
        <div style="margin-bottom: 2rem;">
            <a href="/index.html" style="display: flex; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 0.875rem; padding: 0.75rem 1rem; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); transition: all 0.2s;">
                <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                返回首页
            </a>
        </div>

        <div class="nav-label">系统管理</div>
        <nav>
            <a href="#" class="active">
                <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                用户管理
            </a>
            <!-- 预留其他管理项位置 -->
        </nav>
    </aside>

    <main>
        <header>
            <h1>用户列表</h1>
            <div id="admin-info" style="font-size: 0.875rem; color: var(--text-muted);"></div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <span>总注册用户</span>
                <h3 id="stat-total">0</h3>
            </div>
            <div class="stat-card">
                <span>活跃账号</span>
                <h3 id="stat-active">0</h3>
            </div>
            <div class="stat-card">
                <span>今日新增</span>
                <h3 id="stat-today">0</h3>
            </div>
        </div>

        <div class="table-container">
            <table id="user-table">
                <thead>
                    <tr>
                        <th>用户</th>
                        <th>角色</th>
                        <th>状态</th>
                        <th>电子邮箱</th>
                        <th>手机号码</th>
                        <th>最后登录</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="user-list">
                    <!-- JS 渲染 -->
                </tbody>
            </table>
            <div id="loading" class="loading">加载数据中...</div>
        </div>
    </main>

    <script>
        // 解析 JWT Payload 的工具函数
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        const token = localStorage.getItem('token');
        const user = token ? parseJwt(token) : null;

        // 权限检查
        if (!user || user.role !== 'admin') {
            alert('您没有访问权限！');
            window.location.href = '/index.html';
        } else {
            document.getElementById('admin-info').innerText = `管理员: ${user.nick_name || user.username}`;
        }

        async function adminFetch(url, options = {}) {
            const currentToken = localStorage.getItem('token');
            const headers = {
                ...options.headers,
                'Authorization': `Bearer ${currentToken}`
            };
            if (options.body && !headers['Content-Type']) {
                headers['Content-Type'] = 'application/json';
            }

            const res = await fetch(url, { ...options, headers });
            if (res.status === 401) {
                alert('会话已失效，请重新登录');
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '/login.html';
                return null;
            }
            return res;
        }

        async function loadUsers() {
            try {
                const res = await adminFetch('/api/admin/users');
                if (!res) return;
                const result = await res.json();
                if (result.ok) {
                    renderTable(result.data, result.stats);
                }
            } catch (err) {
                console.error(err);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function renderTable(users, stats) {
            const list = document.getElementById('user-list');
            list.innerHTML = '';
            
            // 使用后端返回的精确统计
            if (stats) {
                document.getElementById('stat-total').innerText = stats.total;
                document.getElementById('stat-active').innerText = stats.active;
                document.getElementById('stat-today').innerText = stats.today;
            }
            
            users.forEach(u => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <div style="font-weight: 600;">${u.nick_name || u.username}</div>
                        <div style="font-size: 0.75rem; color: var(--text-muted)">@${u.username}</div>
                    </td>
                    <td>${u.role}</td>
                    <td>
                        <span class="badge ${u.status === 0 ? 'badge-success' : 'badge-danger'}">
                            ${u.status === 0 ? '正常' : '已停用'}
                        </span>
                    </td>
                    <td style="color: var(--text-muted); font-size: 0.8125rem;">${u.email || '-'}</td>
                    <td style="color: var(--text-muted); font-size: 0.8125rem;">${u.phone || '-'}</td>
                    <td style="color: var(--text-muted); font-size: 0.75rem;">
                        ${u.last_login_at ? u.last_login_at.replace(' ', '<br>') : '从未'}
                    </td>
                    <td>
                        <button class="btn-action" onclick="toggleStatus(${u.id}, ${u.status})">
                            ${u.status === 0 ? '禁用' : '启用'}
                        </button>
                        ${u.role !== 'admin' ? `<button class="btn-action btn-delete" onclick="deleteUser(${u.id})">删除</button>` : ''}
                    </td>
                `;
                list.appendChild(row);
            });
        }

        async function toggleStatus(userId, currentStatus) {
            const newStatus = currentStatus === 0 ? 1 : 0;
            const res = await adminFetch('/api/admin/update-status', {
                method: 'POST',
                body: JSON.stringify({ userId, status: newStatus })
            });
            if (!res) return;
            const result = await res.json();
            if (result.ok) loadUsers();
        }

        async function deleteUser(userId) {
            if (!confirm('确定要删除该用户吗？此操作不可逆。')) return;
            const res = await adminFetch('/api/admin/delete-user', {
                method: 'POST',
                body: JSON.stringify({ userId })
            });
            if (!res) return;
            const result = await res.json();
            if (result.ok) loadUsers();
        }

        loadUsers();
    </script>
</body>
</html>
