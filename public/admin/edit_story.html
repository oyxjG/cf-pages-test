<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级故事编辑器 - 个人聚合面板</title>
    <link rel="stylesheet" href="/theme.css">
    <style>
        :root {
            --bg-grad: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent: #818cf8;
            --accent-soft: rgba(129, 140, 248, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --success-soft: rgba(16, 185, 129, 0.15);
        }

        [data-theme="light"] {
            --bg-grad: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 0, 0, 0.08);
            --accent: #4f46e5;
            --accent-soft: rgba(79, 70, 229, 0.1);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --success: #059669;
            --success-soft: rgba(5, 150, 105, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-grad);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* 顶部工具栏 */
        header {
            height: 64px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .left-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 99px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-2px);
        }

        .editor-title {
            font-size: 1.1rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 99px;
            font-weight: 600;
        }

        .badge-new { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
        .badge-draft { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-published { background: var(--success-soft); color: var(--success); border: 1px solid var(--success); }

        .right-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            border: none;
            padding: 8px 20px;
            border-radius: 10px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 12px var(--accent-soft);
        }
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* 双栏布局 */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 64px);
            overflow: hidden;
        }

        /* 编辑面板 */
        .edit-pane {
            flex: 1;
            border-right: 1px solid var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.8125rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-control {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text-main);
            font-size: 0.9375rem;
            outline: none;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 250px;
        }

        .markdown-textarea {
            flex: 1;
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            color: var(--text-main);
            font-family: "Fira Code", monospace, Consolas, Monaco, sans-serif;
            font-size: 0.95rem;
            line-height: 1.6;
            outline: none;
            resize: none;
            transition: all 0.2s;
        }

        .markdown-textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        /* 拖拽上传覆盖层 */
        .dropzone-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(129, 140, 248, 0.1);
            border: 2.5px dashed var(--accent);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            z-index: 10;
            backdrop-filter: blur(2px);
        }

        .dropzone-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .dropzone-text {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent);
            margin-top: 8px;
        }

        /* 预览面板 */
        .preview-pane {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.15);
        }

        /* 复用故事阅读页的排版效果 */
        .preview-container {
            max-width: 720px;
            margin: 0 auto;
        }

        .article-header {
            text-align: center;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .article-title {
            font-size: 2.2rem;
            font-weight: 900;
            line-height: 1.3;
            margin: 0 0 10px;
        }

        .article-meta {
            font-size: 0.875rem;
            color: var(--text-muted);
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .article-content {
            font-size: 1.125rem;
            line-height: 1.95;
            letter-spacing: 0.02em;
            color: var(--text-main);
            text-align: justify;
        }

        .article-content p {
            margin: 0 0 24px;
        }

        .article-content h1,
        .article-content h2,
        .article-content h3 {
            color: var(--accent);
            margin: 40px 0 20px;
            font-weight: 800;
            line-height: 1.3;
        }
        .article-content h1 { font-size: 1.6rem; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .article-content h2 { font-size: 1.4rem; }
        .article-content h3 { font-size: 1.25rem; }

        .article-content blockquote {
            margin: 32px 0;
            padding: 16px 24px;
            border-left: 4px solid var(--accent);
            background: var(--accent-soft);
            border-radius: 0 16px 16px 0;
            font-style: italic;
            color: var(--text-main);
        }

        .article-content strong {
            color: var(--accent);
            font-weight: 700;
        }
    </style>
</head>
<body>
    <header>
        <div class="left-actions">
            <a href="/admin/index.html#stories" class="back-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                返回后台
            </a>
            <div class="editor-title">
                <span id="editor-page-action">新建故事</span>
                <span id="story-badge" class="status-badge badge-new">新故事</span>
            </div>
        </div>

        <div class="right-actions">
            <button id="btn-save-draft" class="btn btn-secondary">💾 保存草稿</button>
            <button id="btn-publish" class="btn btn-primary">🚀 直接发布</button>
        </div>
    </header>

    <div class="workspace">
        <!-- 左栏编辑 -->
        <section class="edit-pane">
            <div class="input-group">
                <label for="story-title">故事标题</label>
                <input type="text" id="story-title" class="form-control" placeholder="输入故事标题，或在 Markdown 首行写入 # 标题...">
            </div>

            <div class="input-group">
                <label for="story-author">作者</label>
                <input type="text" id="story-author" class="form-control" value="管理员">
            </div>

            <div class="editor-container" id="editor-dropzone">
                <div class="dropzone-overlay" id="drop-overlay">
                    <span style="font-size: 2.5rem;">📄</span>
                    <div class="dropzone-text">松开鼠标导入 Markdown 文件</div>
                </div>
                <label style="font-size: 0.8125rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; margin-bottom: 6px;">故事正文 (Markdown 源码)</label>
                <textarea id="markdown-input" class="markdown-textarea" placeholder="# 故事标题&#10;&#10;> 这里是心流引用块...&#10;&#10;在这里撰写故事的主体正文。系统会自动渲染出右侧的可视化效果，您可以一边编辑一边查看。&#10;&#10;支持拖拽外部 .md 文件到本编辑区直接载入。"></textarea>
            </div>
        </section>

        <!-- 右栏实时预览 -->
        <section class="preview-pane">
            <div class="preview-container">
                <article>
                    <div class="article-header">
                        <h1 class="article-title" id="preview-title">未命名故事</h1>
                        <div class="article-meta">
                            <span>作者: <span id="preview-author">管理员</span></span>
                            <span>最后修改: <span id="preview-time">刚刚</span></span>
                        </div>
                    </div>
                    <div class="article-content" id="preview-content">
                        <!-- 实时渲染区 -->
                        <p style="color: var(--text-muted); font-style: italic;">故事正文内容为空，请在左侧编辑器中开始创作 ☕</p>
                    </div>
                </article>
            </div>
        </section>
    </div>

    <script src="/theme.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. 鉴权与登录状态校验
            function parseJwt(token) {
                try {
                    const base64Url = token.split('.')[1];
                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                    const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join(''));
                    return JSON.parse(jsonPayload);
                } catch (e) {
                    return null;
                }
            }

            const token = localStorage.getItem('token');
            const user = token ? parseJwt(token) : null;

            if (!user || user.role !== 'admin') {
                alert('您没有访问权限！请登录管理员账号。');
                window.location.href = '/index.html';
                return;
            }

            // 2. DOM 节点获取
            const pageActionText = document.getElementById('editor-page-action');
            const storyBadge = document.getElementById('story-badge');
            
            const titleInput = document.getElementById('story-title');
            const authorInput = document.getElementById('story-author');
            const markdownInput = document.getElementById('markdown-input');
            
            const previewTitle = document.getElementById('preview-title');
            const previewAuthor = document.getElementById('preview-author');
            const previewTime = document.getElementById('preview-time');
            const previewContent = document.getElementById('preview-content');

            const btnSaveDraft = document.getElementById('btn-save-draft');
            const btnPublish = document.getElementById('btn-publish');

            const editorDropzone = document.getElementById('editor-dropzone');
            const dropOverlay = document.getElementById('drop-overlay');

            // 3. 获取故事数据
            const urlParams = new URLSearchParams(window.location.search);
            const editStoryId = urlParams.get('id');

            let allStories = JSON.parse(localStorage.getItem('garden-stories') || '[]');
            let targetStory = null;

            // 默认设置作者为当前登录管理员姓名
            authorInput.value = user.nick_name || user.username || '管理员';

            // 4. 回显编辑故事数据
            if (editStoryId) {
                targetStory = allStories.find(s => s.id === editStoryId);
                if (targetStory) {
                    pageActionText.innerText = "编辑故事";
                    titleInput.value = targetStory.title;
                    authorInput.value = targetStory.author;
                    markdownInput.value = targetStory.content;

                    // 设置状态徽章
                    if (targetStory.status === 0 || targetStory.status === 'draft') {
                        storyBadge.className = "status-badge badge-draft";
                        storyBadge.innerText = "草稿";
                    } else {
                        storyBadge.className = "status-badge badge-published";
                        storyBadge.innerText = "已发布";
                    }
                } else {
                    alert('要编辑的故事不存在或已被下架。');
                    window.location.href = '/admin/index.html#stories';
                    return;
                }
            }

            // 5. 轻量级 Markdown 正则解析器 (与 story.html 一致)
            function parseMarkdown(md) {
                if (!md.trim()) {
                    return `<p style="color: var(--text-muted); font-style: italic;">故事正文内容为空，请在左侧编辑器中开始创作 ☕</p>`;
                }
                
                let html = md
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");

                html = html.replace(/^# (.*?)$/gm, '<h1>$1</h1>');
                html = html.replace(/^## (.*?)$/gm, '<h2>$1</h2>');
                html = html.replace(/^### (.*?)$/gm, '<h3>$1</h3>');
                html = html.replace(/^> (.*?)$/gm, '<blockquote>$1</blockquote>');
                html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');

                const lines = html.split('\n');
                const processed = lines.map(line => {
                    const trimmed = line.trim();
                    if (trimmed.length === 0) return '';
                    if (trimmed.startsWith('<h') || trimmed.startsWith('<blockquote') || trimmed.startsWith('</blockquote')) {
                        return line;
                    }
                    return `<p>${line}</p>`;
                });

                return processed.join('\n');
            }

            // 6. 实时渲染更新逻辑 (去抖)
            let renderTimer = null;
            function updatePreview() {
                const title = titleInput.value.trim() || "未命名故事";
                const author = authorInput.value.trim() || "管理员";
                const content = markdownInput.value;

                previewTitle.innerText = title;
                previewAuthor.innerText = author;
                previewTime.innerText = targetStory ? new Date(targetStory.createdAt).toLocaleDateString('zh-CN') : "刚刚";

                previewContent.innerHTML = parseMarkdown(content);
            }

            function triggerPreviewWithDebounce() {
                if (renderTimer) clearTimeout(renderTimer);
                renderTimer = setTimeout(updatePreview, 100);
            }

            // 监听文本输入
            markdownInput.addEventListener('input', triggerPreviewWithDebounce);
            titleInput.addEventListener('input', triggerPreviewWithDebounce);
            authorInput.addEventListener('input', triggerPreviewWithDebounce);

            // 智能提取 Markdown 首行标题逻辑
            markdownInput.addEventListener('input', () => {
                const text = markdownInput.value.trim();
                const firstLine = text.split('\n')[0];
                if (firstLine.startsWith('# ')) {
                    const extracted = firstLine.substring(2).trim();
                    // 仅当用户还没有手动输入标题时或者标题为空时，才自动同步首行到标题框
                    if (!titleInput.value.trim() || titleInput.value.trim() === '未命名故事') {
                        titleInput.value = extracted;
                        previewTitle.innerText = extracted;
                    }
                }
            });

            // 初始化首次渲染
            updatePreview();

            // 7. 拖拽文件导入 Markdown
            if (editorDropzone) {
                window.addEventListener('dragenter', (e) => {
                    e.preventDefault();
                    dropOverlay.classList.add('active');
                });

                dropOverlay.addEventListener('dragover', (e) => {
                    e.preventDefault();
                });

                dropOverlay.addEventListener('dragleave', (e) => {
                    e.preventDefault();
                    // 只有当离开整个覆盖层时才隐藏
                    if (e.relatedTarget === null || !editorDropzone.contains(e.relatedTarget)) {
                        dropOverlay.classList.remove('active');
                    }
                });

                window.addEventListener('drop', (e) => {
                    e.preventDefault();
                    dropOverlay.classList.remove('active');
                    
                    if (e.dataTransfer.files.length > 0) {
                        const file = e.dataTransfer.files[0];
                        if (file.name.endsWith('.md')) {
                            const reader = new FileReader();
                            reader.onload = (event) => {
                                const text = event.target.result;
                                markdownInput.value = text;
                                
                                // 提取首行作为标题
                                const firstLine = text.trim().split('\n')[0];
                                if (firstLine.startsWith('# ')) {
                                    titleInput.value = firstLine.substring(2).trim();
                                } else {
                                    titleInput.value = file.name.substring(0, file.name.lastIndexOf('.'));
                                }
                                triggerPreviewWithDebounce();
                            };
                            reader.readAsText(file);
                        } else {
                            alert('只支持导入 Markdown (.md) 格式的文件！');
                        }
                    }
                });
            }

            // 8. 统一保存故事方法
            function saveStoryData(status) {
                const title = titleInput.value.trim();
                const author = authorInput.value.trim() || '管理员';
                const content = markdownInput.value;

                if (!title || !content.trim()) {
                    alert('标题和故事内容不能为空！');
                    return;
                }

                // 重新读取全部故事列表以确保最新
                allStories = JSON.parse(localStorage.getItem('garden-stories') || '[]');

                const timestamp = Date.now();
                if (targetStory) {
                    // 编辑已有故事
                    allStories = allStories.map(s => {
                        if (s.id === targetStory.id) {
                            return {
                                ...s,
                                title,
                                author,
                                content,
                                status,
                                // 如果是存为草稿，保持原创建时间；若是直接发布，重置为当前最新发布时间
                                createdAt: status === 1 ? timestamp : s.createdAt
                            };
                        }
                        return s;
                    });
                } else {
                    // 新建故事
                    const newStoryObj = {
                        id: timestamp.toString(),
                        title,
                        author,
                        content,
                        status,
                        createdAt: timestamp
                    };
                    allStories.push(newStoryObj);
                }

                localStorage.setItem('garden-stories', JSON.stringify(allStories));
                alert(status === 1 ? '故事已成功发布！' : '草稿保存成功！');
                
                // 跳转回故事管理面板
                window.location.href = '/admin/index.html#stories';
            }

            // 9. 按钮事件绑定
            btnSaveDraft.addEventListener('click', () => saveStoryData(0));
            btnPublish.addEventListener('click', () => saveStoryData(1));
        });
    </script>
</body>
</html>
