<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>全能科学与工程单位换算工坊 - Unit & Radix Studio v2.0</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:;">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../tool-switcher.css">
  <script src="../theme.js"></script>
  <script src="../tool-switcher.js"></script>
  <style>
    :root {
      --header-h: 56px;
      --footer-h: 32px;
      --sidebar-w: 250px;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 顶部 56px 工作台导航栏 */
    .workbench-header {
      height: var(--header-h);
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
      background: var(--paper-strong);
      border: 1px solid var(--line);
    }

    .back-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      transform: translateX(-1px);
    }

    .tool-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      background: rgba(45, 120, 108, 0.12);
      color: var(--teal);
      border: 1px solid rgba(45, 120, 108, 0.25);
    }

    .header-center {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      max-width: 55vw;
    }

    .header-center::-webkit-scrollbar {
      display: none;
    }

    .header-pill-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 600;
      background: var(--paper-strong);
      color: var(--muted);
      border: 1px solid var(--line);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .header-pill-tab:hover {
      color: var(--text);
      border-color: var(--teal);
    }

    .header-pill-tab.active {
      background: var(--teal);
      color: #fff;
      border-color: var(--teal);
      box-shadow: 0 2px 8px rgba(45, 120, 108, 0.25);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-nav-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      background: var(--paper-strong);
      color: var(--text);
      border: 1px solid var(--line);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-nav-action:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .kbd-badge {
      font-family: var(--font-mono);
      font-size: 10.5px;
      padding: 1px 5px;
      background: var(--input-bg);
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--muted);
    }

    /* 100vh 主工作区 */
    .workbench-main {
      flex: 1;
      height: calc(100vh - var(--header-h) - var(--footer-h));
      display: flex;
      overflow: hidden;
    }

    /* 左侧分类导航栏 */
    .workbench-sidebar {
      width: var(--sidebar-w);
      background: var(--paper);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    .sidebar-search-box {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      background: var(--paper-strong);
    }

    .search-input-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--input-bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
    }

    .search-input-wrapper input {
      background: transparent;
      border: none;
      outline: none;
      font-size: 12px;
      color: var(--text);
      width: 100%;
    }

    .category-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .category-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      font-size: 13px;
    }

    .category-item:hover {
      background: var(--paper-strong);
      border-color: var(--line);
    }

    .category-item.active {
      background: rgba(45, 120, 108, 0.12);
      border-color: var(--teal);
      color: var(--teal);
      font-weight: 700;
    }

    .cat-title-group {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .cat-icon {
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cat-badge {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--muted);
      background: var(--paper-strong);
      padding: 1px 6px;
      border-radius: 8px;
      border: 1px solid var(--line);
    }

    .category-item.active .cat-badge {
      background: var(--teal);
      color: #fff;
      border-color: var(--teal);
    }

    /* 右侧中央主视口 */
    .workbench-content {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      background: var(--bg);
    }

    /* 顶部 Banner 与预设栏 */
    .panel-banner {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }

    .banner-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .banner-title-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .banner-icon {
      font-size: 26px;
      background: var(--paper-strong);
      border: 1px solid var(--line);
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .banner-texts h2 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .banner-texts p {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 3px;
    }

    .banner-presets {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding-top: 8px;
      border-top: 1px dashed var(--line);
    }

    .preset-label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--muted);
      margin-right: 4px;
    }

    .preset-tag {
      font-size: 11.5px;
      padding: 3px 9px;
      border-radius: 12px;
      background: var(--paper-strong);
      border: 1px solid var(--line);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .preset-tag:hover {
      border-color: var(--teal);
      color: var(--teal);
      background: rgba(45, 120, 108, 0.08);
      transform: translateY(-1px);
    }

    /* 特化看板卡片容器 */
    .special-panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: var(--shadow-sm);
    }

    .special-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }

    /* 程序员特化：Bit 阵列控制器 */
    .bit-grid-wrapper {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bit-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .bit-btn {
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 4px;
      background: var(--paper-strong);
      border: 1px solid var(--line);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
    }

    .bit-btn:hover {
      border-color: var(--teal);
      color: var(--teal);
    }

    .bit-matrix {
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      gap: 4px;
    }

    .bit-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .bit-num-label {
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: var(--muted);
    }

    .bit-box {
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: var(--input-bg);
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }

    .bit-box:hover {
      transform: scale(1.08);
      border-color: var(--teal);
    }

    .bit-box.active {
      background: var(--teal);
      color: #fff;
      border-color: var(--teal);
      box-shadow: 0 2px 6px rgba(45, 120, 108, 0.35);
    }

    .bit-box.sign-bit {
      border-color: var(--accent);
    }

    .bit-box.sign-bit.active {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 2px 6px rgba(191, 91, 50, 0.35);
    }

    /* 内存 TypedArray 视图 */
    .typed-array-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .typed-card {
      background: var(--input-bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .typed-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .typed-val {
      font-family: var(--font-mono);
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
      word-break: break-all;
      user-select: all;
    }

    /* 前端 CSS 视口特化 */
    .css-calc-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .config-input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .config-input-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .config-input-control {
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
    }

    .config-input-control input {
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-mono);
      font-size: 13.5px;
      color: var(--text);
      width: 100%;
    }

    .config-unit {
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
    }

    .clamp-generator-card {
      background: var(--input-bg);
      border: 1px dashed var(--line);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .clamp-code-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--paper-strong);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: var(--teal);
      border: 1px solid var(--line);
    }

    /* 网络带宽与传输特化 */
    .bandwidth-eta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 900px) {
      .bandwidth-eta-grid {
        grid-template-columns: 1fr;
      }
    }

    .eta-box {
      background: var(--input-bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .eta-stat-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .eta-time-large {
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 800;
      color: var(--teal);
    }

    /* 货币汇率双币互转特化 */
    .quick-swap-container {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .swap-currency-group {
      flex: 1;
      min-width: 240px;
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .currency-select-btn {
      background: var(--paper-strong);
      border: none;
      border-right: 1px solid var(--line);
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      outline: none;
      cursor: pointer;
      min-width: 130px;
    }

    .swap-currency-group input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      padding: 10px 12px;
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .btn-swap-round {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--paper-strong);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s;
    }

    .btn-swap-round:hover {
      background: var(--teal);
      color: #fff;
      transform: rotate(180deg);
      border-color: var(--teal);
    }

    /* 通用单位卡片网格 */
    .unit-cards-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .unit-section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }

    .unit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }

    .unit-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.2s ease;
      position: relative;
    }

    .unit-card:hover {
      border-color: rgba(45, 120, 108, 0.4);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
    }

    .unit-card.active-input {
      border-color: var(--teal);
      background: var(--paper);
      box-shadow: 0 0 0 2px rgba(45, 120, 108, 0.18);
    }

    .unit-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .unit-card-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .unit-card-symbol {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 700;
      color: var(--teal);
      background: rgba(45, 120, 108, 0.1);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .unit-input-wrapper {
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .unit-input-wrapper:focus-within {
      border-color: var(--teal);
      background: var(--paper-strong);
    }

    .unit-input-field {
      flex: 1;
      border: none;
      background: transparent;
      padding: 9px 11px;
      font-family: var(--font-mono);
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text);
      outline: none;
      width: 100%;
    }

    .btn-card-copy {
      background: transparent;
      border: none;
      padding: 8px 10px;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .btn-card-copy:hover {
      color: var(--teal);
      background: rgba(45, 120, 108, 0.1);
    }

    .unit-formula-hint {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 底部 32px 状态监控栏 */
    .workbench-footer {
      height: var(--footer-h);
      background: var(--paper);
      border-top: 1px solid var(--line);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--muted);
      flex-shrink: 0;
      z-index: 90;
    }

    .footer-left,
    .footer-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }

    .precision-select {
      background: var(--input-bg);
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--text);
      font-size: 11px;
      padding: 1px 4px;
      outline: none;
      cursor: pointer;
    }

    /* 气泡提示 Toast */
    .toast-tip {
      position: fixed;
      bottom: 46px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--text);
      color: var(--bg);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }

    .toast-tip.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 768px) {
      .workbench-sidebar {
        width: 60px;
      }
      .category-item span:not(.cat-icon) {
        display: none;
      }
      .category-item {
        justify-content: center;
        padding: 10px 0;
      }
      .sidebar-search-box {
        display: none;
      }
      .bit-matrix {
        grid-template-columns: repeat(8, 1fr);
      }
    }
  </style>
</head>
<body>

  <!-- 顶部 56px 导航栏 -->
  <header class="workbench-header">
    <div class="header-left">
      <a href="../index.html" class="back-btn" title="返回控制台首页">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>返回首页</span>
      </a>
      <div class="tool-title">
        <span>📐 单位换算工坊</span>
        <span class="badge-pill">Unit Studio v2.0</span>
      </div>
    </div>

    <!-- 顶部快速分类胶囊 -->

    // ==========================================
    // 精度格式化工具
    // ==========================================
    function formatNumber(num) {
      if (num === null || num === undefined || isNaN(num) || !isFinite(num)) return '';
      if (num === 0) return '0';

      const abs = Math.abs(num);
      // 极大或极小值，使用科学计数法
      if (abs >= 1e15 || (abs < 1e-6 && abs > 0)) {
        return num.toExponential(currentPrecision).replace(/\.?0+e/, 'e');
      }

      let str = Number(num).toFixed(currentPrecision);
      str = str.replace(/\.?0+$/, '');
      return str === '-0' ? '0' : str;
    }

    // ==========================================
    // 分类切换与整体渲染
    // ==========================================
    function switchCategory(cat) {
      if (!CATEGORIES_CONFIG[cat]) return;
      currentCategory = cat;
      unitSearchKeyword = '';
      const filterInput = document.getElementById('unitSearchInput');
      if (filterInput) filterInput.value = '';

      // 更新顶部胶囊
      document.querySelectorAll('.header-pill-tab').forEach(pill => {
        pill.classList.toggle('active', pill.getAttribute('data-cat') === cat);
      });

      // 更新左侧侧边栏
      document.querySelectorAll('.category-item').forEach(item => {
        item.classList.toggle('active', item.getAttribute('data-cat') === cat);
      });

      // 更新 Banner
      const config = CATEGORIES_CONFIG[cat];
      document.getElementById('bannerIcon').innerText = config.icon;
      document.getElementById('bannerTitle').innerText = config.title;
      document.getElementById('bannerDesc').innerText = config.desc;

      // 渲染预设标签
      renderPresets(config.presets);

      // 更新底部状态
      document.getElementById('statusCategory').innerText = `当前模式: ${config.title.split(' ')[0]}`;

      // 渲染特化面板
      renderSpecialPanel(cat);

      // 渲染主网格卡片
      renderUnitGrid(cat);
    }

    function renderPresets(presets) {
      const container = document.getElementById('bannerPresets');
      if (!presets || presets.length === 0) {
        container.style.display = 'none';
        return;
      }
      container.style.display = 'flex';
      container.innerHTML = `
        <span class="preset-label">⚡ 常用预设:</span>
        ${presets.map(p => `
          <button class="preset-tag" onclick="applyPreset('${p.key}', '${p.val}')">${p.label}</button>
        `).join('')}
      `;
    }

    // ==========================================
    // 关键修复：预设装载与全局联动
    // ==========================================
    function applyPreset(key, val) {
      // 1. 将预设值显式填入目标输入框
      const targetInput = document.getElementById(`input-${key}`);
      if (targetInput) {
        targetInput.value = val;
      }

      // 2. 更新底部状态栏基准
      const item = findUnitById(key);
      if (item) {
        document.getElementById('statusBaseUnit').innerText = `${item.symbol} (${item.name})`;
      }

      // 3. 驱动各分类逻辑（isPreset = true）
      if (currentCategory === 'radix') {
        radixCurrentDec = BigInt(val);
        updateRadixViews();
      } else if (currentCategory === 'css_unit') {
        handleCssLiveInput(key, val, true);
      } else if (currentCategory === 'bandwidth') {
        handleBandwidthLiveInput(key, val, true);
      } else if (currentCategory === 'physics') {
        handlePhysicsLiveInput(key, val, true);
      } else if (currentCategory === 'daily') {
        handleDailyLiveInput(key, val, true);
      } else if (currentCategory === 'currency') {
        handleCurrencyLiveInput(key, val, true);
      } else if (currentCategory === 'data') {
        handleDataLiveInput(key, val, true);
      }
      showToast(`已装载预设: ${val}`);
    }

    function resetCurrentCategory() {
      if (currentCategory === 'radix') {
        radixCurrentDec = 255n;
        updateRadixViews();
      } else if (currentCategory === 'css_unit') {
        cssBaseFontSize = 16;
        cssViewportWidth = 1920;
        cssViewportHeight = 1080;
        switchCategory('css_unit');
        handleCssLiveInput('px', 16, true);
      } else if (currentCategory === 'bandwidth') {
        bandwidthMbps = 1000;
        transferFileSizeMB = 51200;
        switchCategory('bandwidth');
        handleBandwidthLiveInput('mbps', 1000, true);
      } else if (currentCategory === 'data') {
        handleDataLiveInput('GB', 1, true);
      } else if (currentCategory === 'physics') {
        handlePhysicsLiveInput('celsius', 100, true);
      } else if (currentCategory === 'daily') {
        handleDailyLiveInput('len_m', 1, true);
      } else if (currentCategory === 'currency') {
        handleCurrencyLiveInput('CNY', 1000, true);
      }
      showToast('已重置当前分类为默认状态');
    }

    // ==========================================
    // 渲染单位卡片网格
    // ==========================================
    function renderUnitGrid(cat) {
      const grid = document.getElementById('unitCardsGrid');
      grid.innerHTML = '';
      const config = CATEGORIES_CONFIG[cat];
      let totalUnits = 0;

      if (config.subGroups) {
        config.subGroups.forEach(group => {
          const groupHeader = document.createElement('div');
          groupHeader.style.gridColumn = '1 / -1';
          groupHeader.innerHTML = `<h3 style="font-size:13.5px; font-weight:700; color:var(--teal); margin: 10px 0 4px 0;">${group.name}</h3>`;
          grid.appendChild(groupHeader);

          group.units.forEach(u => {
            totalUnits++;
            grid.appendChild(createUnitCardElement(u, cat));
          });
        });
      } else {
        config.units.forEach(u => {
          totalUnits++;
          grid.appendChild(createUnitCardElement(u, cat));
        });
      }

      document.getElementById('unitCountBadge').innerText = `${totalUnits} 个单位`;

      // 填充默认值
      if (cat === 'radix') {
        updateRadixViews();
      } else if (cat === 'css_unit') {
        handleCssLiveInput('px', 16, true);
      } else if (cat === 'bandwidth') {
        handleBandwidthLiveInput('mbps', 1000, true);
      } else if (cat === 'data') {
        handleDataLiveInput('GB', 1, true);
      } else if (cat === 'physics') {
        handlePhysicsLiveInput('celsius', 100, true);
      } else if (cat === 'daily') {
        handleDailyLiveInput('len_m', 1, true);
      } else if (cat === 'currency') {
        handleCurrencyLiveInput('CNY', 1000, true);
      }
    }

    function createUnitCardElement(item, cat) {
      const card = document.createElement('div');
      card.className = 'unit-card';
      card.id = `card-${item.id}`;
      card.setAttribute('data-unit-id', item.id);
      card.setAttribute('data-unit-name', (item.name + item.symbol).toLowerCase());

      card.innerHTML = `
        <div class="unit-card-header">
          <span class="unit-card-name">
            <span>${item.name}</span>
          </span>
          <span class="unit-card-symbol">${item.symbol}</span>
        </div>
        <div class="unit-input-wrapper">
          <input type="text" 
                 class="unit-input-field" 
                 id="input-${item.id}" 
                 data-unit="${item.id}"
                 placeholder="输入数值..."
                 oninput="dispatchLiveInput('${item.id}', this.value)"
                 onfocus="onInputFocus('${item.id}')"
                 onblur="onInputBlur('${item.id}')">
          <button class="btn-card-copy" title="复制数值" onclick="copyCardValue('${item.id}')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
        </div>
        <div class="unit-formula-hint" title="${item.hint || ''}">${item.hint || ''}</div>
      `;
      return card;
    }

    function onInputFocus(unitId) {
      const card = document.getElementById(`card-${unitId}`);
      if (card) card.classList.add('active-input');
      const item = findUnitById(unitId);
      if (item) {
        document.getElementById('statusBaseUnit').innerText = `${item.symbol} (${item.name})`;
      }
    }

    function onInputBlur(unitId) {
      const card = document.getElementById(`card-${unitId}`);
      if (card) card.classList.remove('active-input');
    }

    function findUnitById(unitId) {
      const config = CATEGORIES_CONFIG[currentCategory];
      if (config.units) return config.units.find(u => u.id === unitId);
      if (config.subGroups) {
        for (const g of config.subGroups) {
          const found = g.units.find(u => u.id === unitId);
          if (found) return found;
        }
      }
      return null;
    }

    // ==========================================
    // 调度分发用户手动输入
    // ==========================================
    function dispatchLiveInput(unitId, valStr) {
      if (currentCategory === 'radix') {
        handleRadixLiveInput(unitId, valStr);
      } else if (currentCategory === 'css_unit') {
        handleCssLiveInput(unitId, valStr, false);
      } else if (currentCategory === 'bandwidth') {
        handleBandwidthLiveInput(unitId, valStr, false);
      } else if (currentCategory === 'data') {
        handleDataLiveInput(unitId, valStr, false);
      } else if (currentCategory === 'physics') {
        handlePhysicsLiveInput(unitId, valStr, false);
      } else if (currentCategory === 'daily') {
        handleDailyLiveInput(unitId, valStr, false);
      } else if (currentCategory === 'currency') {
        handleCurrencyLiveInput(unitId, valStr, false);
      }
    }

    // ==========================================
    // 1. 程序员进制与内存 (Radix) 核心计算
    // ==========================================
    function initBitControls() {
      const matrix = document.getElementById('bitMatrix32');
      if (!matrix) return;
      matrix.innerHTML = '';

      for (let i = 31; i >= 0; i--) {
        const item = document.createElement('div');
        item.className = 'bit-item';
        item.innerHTML = `
          <span class="bit-num-label">${i}</span>
          <div class="bit-box ${i === 31 ? 'sign-bit' : ''}" id="bit-${i}" onclick="toggleBit(${i})">0</div>
        `;
        matrix.appendChild(item);
      }
    }

    function toggleBit(index) {
      const mask = 1n << BigInt(index);
      radixCurrentDec = radixCurrentDec ^ mask;
      updateRadixViews();
    }

    function radixBitAll(val) {
      radixCurrentDec = val === 1 ? 0xFFFFFFFFn : 0n;
      updateRadixViews();
    }

    function radixBitInvert() {
      radixCurrentDec = (~radixCurrentDec) & 0xFFFFFFFFn;
      updateRadixViews();
    }

    function radixBitShift(dir) {
      if (dir === 'left') {
        radixCurrentDec = (radixCurrentDec << 1n) & 0xFFFFFFFFn;
      } else {
        radixCurrentDec = (radixCurrentDec >> 1n) & 0xFFFFFFFFn;
      }
      updateRadixViews();
    }

    function toggleEndian() {
      endianMode = endianMode === 'little' ? 'big' : 'little';
      const el = document.getElementById('endianLabel');
      if (el) el.innerText = endianMode === 'little' ? '小端序 (Little)' : '大端序 (Big)';
      updateRadixViews();
    }

    function handleRadixLiveInput(unitId, valStr) {
      const clean = valStr.trim();
      if (clean === '') return;

      try {
        if (unitId === 'bin') {
          radixCurrentDec = BigInt('0b' + clean.replace(/^0b/i, ''));
        } else if (unitId === 'oct') {
          radixCurrentDec = BigInt('0o' + clean.replace(/^0o/i, ''));
        } else if (unitId === 'dec') {
          radixCurrentDec = BigInt(clean);
        } else if (unitId === 'hex') {
          radixCurrentDec = BigInt('0x' + clean.replace(/^0x/i, ''));
        } else if (unitId === 'base32') {
          radixCurrentDec = BigInt(parseInt(clean, 32));
        } else if (unitId === 'base36') {
          radixCurrentDec = BigInt(parseInt(clean, 36));
        }
        updateRadixViews(unitId);
      } catch (e) {
        // 输入不完整或非法字符时静默
      }
    }

    function updateRadixViews(excludeUnitId = null) {
      const dec = radixCurrentDec;

      const map = {
        bin: dec.toString(2),
        oct: dec.toString(8),
        dec: dec.toString(10),
        hex: '0x' + dec.toString(16).toUpperCase(),
        base32: dec <= BigInt(Number.MAX_SAFE_INTEGER) ? Number(dec).toString(32).toUpperCase() : '超出安全范围',
        base36: dec <= BigInt(Number.MAX_SAFE_INTEGER) ? Number(dec).toString(36).toUpperCase() : '超出安全范围'
      };

      Object.keys(map).forEach(key => {
        if (key !== excludeUnitId) {
          const inp = document.getElementById(`input-${key}`);
          if (inp) inp.value = map[key];
        }
      });

      const safe32 = Number(dec & 0xFFFFFFFFn);
      for (let i = 0; i < 32; i++) {
        const bitVal = (safe32 >> i) & 1;
        const bitBox = document.getElementById(`bit-${i}`);
        if (bitBox) {
          bitBox.innerText = bitVal;
          bitBox.classList.toggle('active', bitVal === 1);
        }
      }

      updateTypedArrayCards(safe32);
    }

    function updateTypedArrayCards(val32) {
      const container = document.getElementById('typedArrayGrid');
      if (!container) return;

      const buf = new ArrayBuffer(8);
      const view = new DataView(buf);
      const isLittle = (endianMode === 'little');
      view.setUint32(0, val32, isLittle);

      const floatVal = view.getFloat32(0, isLittle);
      const int8 = view.getInt8(0);
      const uint8 = view.getUint8(0);
      const int16 = view.getInt16(0, isLittle);
      const uint16 = view.getUint16(0, isLittle);
      const int32 = view.getInt32(0, isLittle);
      const uint32 = val32 >>> 0;

      const signBit = (val32 >>> 31) & 1;
      const expBits = (val32 >>> 23) & 0xFF;
      const mantissaBits = val32 & 0x7FFFFF;

      const ieeeEl = document.getElementById('ieee754Float');
      if (ieeeEl) {
        ieeeEl.innerHTML = `Float32: <strong>${floatVal.toPrecision(6)}</strong> (S: ${signBit} | E: ${expBits} | M: ${mantissaBits})`;
      }

      const types = [
        { name: 'Uint8 (无符号字节)', val: uint8, range: '0 ~ 255' },
        { name: 'Int8 (有符号字节)', val: int8, range: '-128 ~ 127' },
        { name: 'Uint16 (无符号短整型)', val: uint16, range: '0 ~ 65535' },
        { name: 'Int16 (有符号短整型)', val: int16, range: '-32768 ~ 32767' },
        { name: 'Uint32 (无符号整型)', val: uint32, range: '0 ~ 4294967295' },
        { name: 'Int32 (有符号整型)', val: int32, range: '-2147483648 ~ 2147483647' },
        { name: 'Float32 (单精度浮点)', val: floatVal.toFixed(4), range: 'IEEE-754 32-bit' },
        { name: 'Hex 字节排列 (' + endianMode + ')', val: '0x' + Array.from(new Uint8Array(buf.slice(0, 4))).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' '), range: '内存存储流' }
      ];

      container.innerHTML = types.map(t => `
        <div class="typed-card">
          <div class="typed-label">
            <span>${t.name}</span>
            <span style="font-size:10px;">${t.range}</span>
          </div>
          <div class="typed-val">${t.val}</div>
        </div>
      `).join('');
    }

    // ==========================================
    // 2. 前端 CSS & 视口换算
    // ==========================================
    function updateCssBase(val, type) {
      const num = parseFloat(val) || 1;
      if (type === 'font') cssBaseFontSize = num;
      if (type === 'vw') cssViewportWidth = num;
      if (type === 'vh') cssViewportHeight = num;

      const currentPx = parseFloat(document.getElementById('input-px')?.value) || 16;
      handleCssLiveInput('px', currentPx, true);
      recalcCssClamp();
    }

    function handleCssLiveInput(unitId, val, updateSelf = false) {
      const num = parseFloat(val);
      if (isNaN(num)) return;

      let px = 0;
      switch (unitId) {
        case 'px': px = num; break;
        case 'rem': px = num * cssBaseFontSize; break;
        case 'em': px = num * cssBaseFontSize; break;
        case 'pt': px = num * (4 / 3); break;
        case 'vw': px = (num / 100) * cssViewportWidth; break;
        case 'vh': px = (num / 100) * cssViewportHeight; break;
        case 'cqw': px = (num / 100) * cssViewportWidth; break;
        case 'inch': px = num * 96; break;
        case 'cm': px = num * (96 / 2.54); break;
      }

      const results = {
        px: px,
        rem: px / cssBaseFontSize,
        em: px / cssBaseFontSize,
        pt: px * 0.75,
        vw: (px / cssViewportWidth) * 100,
        vh: (px / cssViewportHeight) * 100,
        cqw: (px / cssViewportWidth) * 100,
        inch: px / 96,
        cm: px / (96 / 2.54)
      };

      Object.keys(results).forEach(key => {
        if (key !== unitId || updateSelf) {
          const inp = document.getElementById(`input-${key}`);
          if (inp) inp.value = formatNumber(results[key]);
        }
      });

      recalcCssClamp(px);
    }

    function recalcCssClamp(currentPx = 16) {
      const clampCode = document.getElementById('clampResultCode');
      if (!clampCode) return;

      const minW = 375;
      const maxW = cssViewportWidth || 1920;
      const minFont = 14;
      const maxFont = Math.max(minFont + 4, currentPx);

      const slope = (maxFont - minFont) / (maxW - minW);
      const yAxisIntersection = -minW * slope + minFont;

      const minRem = (minFont / cssBaseFontSize).toFixed(3) + 'rem';
      const maxRem = (maxFont / cssBaseFontSize).toFixed(3) + 'rem';
      const yRem = (yAxisIntersection / cssBaseFontSize).toFixed(3) + 'rem';
      const vwPart = (slope * 100).toFixed(2) + 'vw';

      clampCode.innerText = `font-size: clamp(${minRem}, ${yRem} + ${vwPart}, ${maxRem});`;
    }

    // ==========================================
    // 3. 网络带宽与传输耗时计算
    // ==========================================
    function handleBandwidthLiveInput(unitId, val, updateSelf = false) {
      const num = parseFloat(val);
      if (isNaN(num)) return;

      let bps = 0;
      switch (unitId) {
        case 'bps': bps = num; break;
        case 'kbps': bps = num * 1e3; break;
        case 'mbps': bps = num * 1e6; break;
        case 'gbps': bps = num * 1e9; break;
        case 'tbps': bps = num * 1e12; break;
        case 'Bps': bps = num * 8; break;
        case 'KBps': bps = num * 8 * 1e3; break;
        case 'MBps': bps = num * 8 * 1e6; break;
        case 'GBps': bps = num * 8 * 1e9; break;
      }

      bandwidthMbps = bps / 1e6;

      const results = {
        bps: bps,
        kbps: bps / 1e3,
        mbps: bps / 1e6,
        gbps: bps / 1e9,
        tbps: bps / 1e12,
        Bps: bps / 8,
        KBps: bps / 8000,
        MBps: bps / 8e6,
        GBps: bps / 8e9
      };

      Object.keys(results).forEach(key => {
        if (key !== unitId || updateSelf) {
          const inp = document.getElementById(`input-${key}`);
          if (inp) inp.value = formatNumber(results[key]);
        }
      });

      recalcBandwidthEta();
    }

    function updateEtaFileSize(val) {
      transferFileSizeMB = parseFloat(val) || 1;
      recalcBandwidthEta();
    }

    function recalcBandwidthEta() {
      const theoryEl = document.getElementById('theorySpeed');
      const realEl = document.getElementById('realSpeed');
      const etaDisplay = document.getElementById('etaTimeDisplay');
      if (!theoryEl || !realEl || !etaDisplay) return;

      const theoryMBs = bandwidthMbps / 8;
      const realMBs = theoryMBs * 0.88;

      theoryEl.innerText = `${formatNumber(theoryMBs)} MB/s`;
      realEl.innerText = `${formatNumber(realMBs)} MB/s`;

      if (realMBs <= 0) {
        etaDisplay.innerText = '无法测算';
        return;
      }

      const totalSeconds = transferFileSizeMB / realMBs;
      etaDisplay.innerText = formatDuration(totalSeconds);
    }

    function formatDuration(seconds) {
      if (seconds < 1) return '小于 1 秒 (极速完成)';
      const d = Math.floor(seconds / 86400);
      const h = Math.floor((seconds % 86400) / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);

      const parts = [];
      if (d > 0) parts.push(`${d}天`);
      if (h > 0) parts.push(`${h}小时`);
      if (m > 0) parts.push(`${m}分`);
      if (s > 0 || parts.length === 0) parts.push(`${s}秒`);
      return parts.join(' ');
    }

    // ==========================================
    // 4. 数据存储容量计算 (1000 vs 1024)
    // ==========================================
    function handleDataLiveInput(unitId, val, updateSelf = false) {
      const num = parseFloat(val);
      if (isNaN(num)) return;

      const config = CATEGORIES_CONFIG.data.units;
      const currentItem = config.find(u => u.id === unitId);
      if (!currentItem) return;

      const baseBits = currentItem.toBase(num);

      config.forEach(u => {
        if (u.id !== unitId || updateSelf) {
          const calculated = u.fromBase(baseBits);
          const inp = document.getElementById(`input-${u.id}`);
          if (inp) inp.value = formatNumber(calculated);
        }
      });
    }

    // ==========================================
    // 5. 物理与工程度量 (温度/时间纳秒/频率/压强)
    // ==========================================
    function handlePhysicsLiveInput(unitId, val, updateSelf = false) {
      const num = parseFloat(val);
      if (isNaN(num)) return;

      const isTemp = ['celsius', 'fahrenheit', 'kelvin', 'rankine'].includes(unitId);
      const isTime = ['ns', 'us', 'ms', 's', 'min', 'hour', 'day', 'hz', 'khz', 'mhz', 'ghz'].includes(unitId);
      const isAngleOrPress = ['deg', 'rad', 'grad', 'pa', 'kpa', 'mpa', 'bar', 'atm', 'psi', 'mmhg'].includes(unitId);

      if (isTemp) {
        let celsius = 0;
        if (unitId === 'celsius') celsius = num;
        else if (unitId === 'fahrenheit') celsius = (num - 32) / 1.8;
        else if (unitId === 'kelvin') celsius = num - 273.15;
        else if (unitId === 'rankine') celsius = (num - 491.67) / 1.8;

        const results = {
          celsius: celsius,
          fahrenheit: celsius * 1.8 + 32,
          kelvin: celsius + 273.15,
          rankine: (celsius + 273.15) * 1.8
        };

        Object.keys(results).forEach(k => {
          if (k !== unitId || updateSelf) {
            const inp = document.getElementById(`input-${k}`);
            if (inp) inp.value = formatNumber(results[k]);
          }
        });
      } else if (isTime) {
        let s = 0;
        switch (unitId) {
          case 'ns': s = num / 1e9; break;
          case 'us': s = num / 1e6; break;
          case 'ms': s = num / 1e3; break;
          case 's': s = num; break;
          case 'min': s = num * 60; break;
          case 'hour': s = num * 3600; break;
          case 'day': s = num * 86400; break;
          case 'hz': s = num > 0 ? 1 / num : 0; break;
          case 'khz': s = num > 0 ? 1 / (num * 1e3) : 0; break;
          case 'mhz': s = num > 0 ? 1 / (num * 1e6) : 0; break;
          case 'ghz': s = num > 0 ? 1 / (num * 1e9) : 0; break;
        }

        const results = {
          ns: s * 1e9,
          us: s * 1e6,
          ms: s * 1e3,
          s: s,
          min: s / 60,
          hour: s / 3600,
          day: s / 86400,
          hz: s > 0 ? 1 / s : 0,
          khz: s > 0 ? (1 / s) / 1e3 : 0,
          mhz: s > 0 ? (1 / s) / 1e6 : 0,
          ghz: s > 0 ? (1 / s) / 1e9 : 0
        };

        Object.keys(results).forEach(k => {
          if (k !== unitId || updateSelf) {
            const inp = document.getElementById(`input-${k}`);
            if (inp) inp.value = formatNumber(results[k]);
          }
        });
      } else if (isAngleOrPress) {
        if (['deg', 'rad', 'grad'].includes(unitId)) {
          let deg = 0;
          if (unitId === 'deg') deg = num;
          else if (unitId === 'rad') deg = num * (180 / Math.PI);
          else if (unitId === 'grad') deg = num * 0.9;

          const results = {
            deg: deg,
            rad: deg * (Math.PI / 180),
            grad: deg / 0.9
          };
          Object.keys(results).forEach(k => {
            if (k !== unitId || updateSelf) {
              const inp = document.getElementById(`input-${k}`);
              if (inp) inp.value = formatNumber(results[k]);
            }
          });
        } else {
          let pa = 0;
          switch (unitId) {
            case 'pa': pa = num; break;
            case 'kpa': pa = num * 1e3; break;
            case 'mpa': pa = num * 1e6; break;
            case 'bar': pa = num * 1e5; break;
            case 'atm': pa = num * 101325; break;
            case 'psi': pa = num * 6894.757; break;
            case 'mmhg': pa = num * 133.322; break;
          }

          const results = {
            pa: pa,
            kpa: pa / 1e3,
            mpa: pa / 1e6,
            bar: pa / 1e5,
            atm: pa / 101325,
            psi: pa / 6894.757,
            mmhg: pa / 133.322
          };
          Object.keys(results).forEach(k => {
            if (k !== unitId || updateSelf) {
              const inp = document.getElementById(`input-${k}`);
              if (inp) inp.value = formatNumber(results[k]);
            }
          });
        }
      }
    }

    // ==========================================
    // 6. 日常生活通用度量 (长度/面积/重量/体积)
    // ==========================================
    function handleDailyLiveInput(unitId, val, updateSelf = false) {
      const num = parseFloat(val);
      if (isNaN(num)) return;

      const subGroups = CATEGORIES_CONFIG.daily.subGroups;
      let targetGroup = null;
      let targetUnit = null;

      for (const g of subGroups) {
        const found = g.units.find(u => u.id === unitId);
        if (found) {
          targetGroup = g;
          targetUnit = found;
          break;
        }
      }

      if (!targetGroup || !targetUnit) return;

      const baseVal = targetUnit.toBase(num);
      targetGroup.units.forEach(u => {
        if (u.id !== unitId || updateSelf) {
          const calculated = u.fromBase(baseVal);
          const inp = document.getElementById(`input-${u.id}`);
          if (inp) inp.value = formatNumber(calculated);
        }
      });
    }

    // ==========================================
    // 7. 世界外汇汇率计算与全双向联动
    // ==========================================
    function handleCurrencyLiveInput(code, val, isPresetOrExternal = false) {
      const num = parseFloat(val);
      if (isNaN(num)) return;

      const rateToCNY = STATIC_RATES[code] || 1;
      const baseCNY = num / rateToCNY;

      // 更新卡片网格
      Object.keys(STATIC_RATES).forEach(c => {
        const inp = document.getElementById(`input-${c}`);
        if (inp) {
          if (c === code) {
            if (isPresetOrExternal) inp.value = formatNumber(num);
          } else {
            const calculated = baseCNY * STATIC_RATES[c];
            inp.value = formatNumber(calculated);
          }
        }
      });

      // 同步更新上方的双币快速互换控制器
      syncQuickCurrencyFromCards(code, num);
    }

    function syncQuickCurrencyFromCards(code, num) {
      const selectA = document.getElementById('quickCurrA');
      const selectB = document.getElementById('quickCurrB');
      const inputA = document.getElementById('quickCurrValA');
      const inputB = document.getElementById('quickCurrValB');
      if (!selectA || !selectB || !inputA || !inputB) return;

      if (selectA.value === code) {
        inputA.value = num;
        runQuickCurrencySwap('a', false);
      } else if (selectB.value === code) {
        inputB.value = num;
        runQuickCurrencySwap('b', false);
      } else {
        selectA.value = code;
        inputA.value = num;
        runQuickCurrencySwap('a', false);
      }
    }

    function runQuickCurrencySwap(source, syncToGrid = true) {
      const selectA = document.getElementById('quickCurrA');
      const selectB = document.getElementById('quickCurrB');
      const inputA = document.getElementById('quickCurrValA');
      const inputB = document.getElementById('quickCurrValB');
      if (!selectA || !selectB || !inputA || !inputB) return;

      const currA = selectA.value;
      const currB = selectB.value;
      const rateA = STATIC_RATES[currA] || 1;
      const rateB = STATIC_RATES[currB] || 1;

      if (source === 'a') {
        const valA = parseFloat(inputA.value) || 0;
        const cny = valA / rateA;
        const valB = cny * rateB;
        inputB.value = formatNumber(valB);
        if (syncToGrid) {
          handleCurrencyLiveInput(currA, valA, false);
        }
      } else {
        const valB = parseFloat(inputB.value) || 0;
        const cny = valB / rateB;
        const valA = cny * rateA;
        inputA.value = formatNumber(valA);
        if (syncToGrid) {
          handleCurrencyLiveInput(currB, valB, false);
        }
      }
    }

    function flipQuickCurrency() {
      const selectA = document.getElementById('quickCurrA');
      const selectB = document.getElementById('quickCurrB');
      if (!selectA || !selectB) return;

      const temp = selectA.value;
      selectA.value = selectB.value;
      selectB.value = temp;
      runQuickCurrencySwap('a', true);
      showToast('已交换两币种');
    }

    // ==========================================
    // 搜索与过滤交互
    // ==========================================
    function filterCategories(query) {
      const q = query.trim().toLowerCase();
      document.querySelectorAll('.category-item').forEach(btn => {
        const text = btn.innerText.toLowerCase();
        btn.style.display = text.includes(q) ? 'flex' : 'none';
      });
    }

    function filterCurrentUnits(query) {
      const q = query.trim().toLowerCase();
      document.querySelectorAll('.unit-card').forEach(card => {
        const text = card.getAttribute('data-unit-name') || '';
        card.style.display = text.includes(q) ? 'flex' : 'none';
      });
    }

    function changePrecision(val) {
      currentPrecision = parseInt(val, 10);
      const firstInput = document.querySelector('.unit-input-field');
      if (firstInput && firstInput.value) {
        dispatchLiveInput(firstInput.getAttribute('data-unit'), firstInput.value);
      }
      showToast(`精度已设为: ${currentPrecision} 位小数`);
    }

    // ==========================================
    // 剪贴板复制与 Toast
    // ==========================================
    function copyCardValue(unitId) {
      const inp = document.getElementById(`input-${unitId}`);
      if (inp && inp.value) {
        copySnippet(inp.value);
      }
    }

    function copySnippet(text) {
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        showToast(`已复制: ${text}`);
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(`已复制: ${text}`);
      });
    }

    function showToast(msg) {
      const tip = document.getElementById('toastTip');
      if (!tip) return;
      tip.innerText = msg;
      tip.classList.add('show');
      setTimeout(() => tip.classList.remove('show'), 2000);
    }

    // ==========================================
    // 工具箱抽屉统一调用
    // ==========================================
    function toggleToolboxDrawer() {
      if (window.ToolSwitcher && typeof window.ToolSwitcher.open === 'function') {
        window.ToolSwitcher.open();
      } else {
        showToast('正在呼出工具箱 (Ctrl+K)...');
      }
    }

    // 初始化运行
    document.addEventListener('DOMContentLoaded', () => {
      switchCategory('radix');
    });
  </script>
</body>
</html>
