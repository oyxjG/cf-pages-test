<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>正则积木工坊 - 沉浸式工作台</title>
  <link rel="stylesheet" href="../theme.css">
  <script src="../theme.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      overflow: hidden;
      font-family: "JetBrains Mono", "Fira Code", "SF Pro Display", "PingFang SC", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(42, 157, 143, 0.08), transparent 30%),
        radial-gradient(circle at 85% 15%, rgba(224, 122, 95, 0.08), transparent 25%),
        linear-gradient(135deg, var(--grad-start) 0%, var(--bg) 45%, var(--grad-end) 100%);
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航栏 (56px) */
    .workbench-header {
      height: 56px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--paper);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
      z-index: 30;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      background: var(--paper-strong);
      border: 1px solid var(--line);
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      color: var(--teal);
      border-color: var(--teal);
      transform: translateX(-2px);
    }

    .tool-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      background: rgba(42, 157, 143, 0.12);
      color: var(--teal);
      border: 1px solid rgba(42, 157, 143, 0.25);
    }

    .header-center {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      border: 1px solid var(--line);
      background: var(--paper-strong);
      color: var(--text);
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      border-color: var(--teal);
      color: var(--teal);
    }

    .nav-btn.primary {
      background: var(--teal);
      border-color: var(--teal);
      color: #fff;
    }

    .nav-btn.primary:hover {
      background: #238276;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 主工作区双栏 (高度铺满) */
    .workbench-main {
      flex: 1;
      height: calc(100vh - 56px - 32px);
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      overflow: hidden;
    }

    /* 左栏：积木链工作区 */
    .col-builder {
      height: 100%;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .builder-toolbar {
      height: 42px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
    }

    .builder-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 规则卡片 */
    .rule-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow);
      transition: all 0.2s;
      position: relative;
    }

    .rule-card:hover {
      border-color: var(--teal);
    }

    .rule-card.disabled {
      opacity: 0.55;
      filter: grayscale(0.6);
      background: var(--paper-strong);
    }

    .rule-row-main {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .rule-index-badge {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--teal);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .logic-select {
      width: 72px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--input-bg);
      color: var(--teal);
      font-weight: 700;
      font-size: 12px;
      outline: none;
    }

    .type-select {
      flex: 1.2;
      min-width: 140px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--input-bg);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
      outline: none;
    }

    .type-select:focus, .logic-select:focus, .value-input:focus {
      border-color: var(--teal);
    }

    .value-input {
      flex: 1.5;
      min-width: 130px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--input-bg);
      color: var(--text);
      font-family: inherit;
      font-size: 12.5px;
      outline: none;
    }

    .rule-actions {
      display: flex;
      align-items: center;
      gap: 3px;
      margin-left: auto;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .icon-btn:hover {
      color: var(--text);
      background: var(--paper-strong);
    }

    .icon-btn.danger:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }

    /* 规则参数第二行 (修饰与量词) */
    .rule-row-sub {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-top: 8px;
      border-top: 1px dashed var(--line);
      font-size: 12px;
      flex-wrap: wrap;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      user-select: none;
      color: var(--text);
    }

    .quantifier-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .quantifier-select {
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--input-bg);
      color: var(--text);
      font-size: 11.5px;
      outline: none;
    }

    .num-input {
      width: 46px;
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--input-bg);
      color: var(--text);
      font-size: 12px;
      text-align: center;
      outline: none;
    }

    /* 添加新规则按钮 */
    .add-step-btn {
      width: 100%;
      border: 2px dashed var(--line);
      background: transparent;
      border-radius: var(--radius-sm);
      padding: 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .add-step-btn:hover {
      border-color: var(--teal);
      color: var(--teal);
      background: rgba(42, 157, 143, 0.04);
    }

    /* 右栏：生成大盘与实时靶场 */
    .col-preview {
      height: 100%;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: var(--bg);
    }

    .preview-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .preview-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
    }

    .preview-card-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .regex-big-box {
      background: var(--input-bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      color: var(--teal);
      word-break: break-all;
      text-align: center;
      user-select: all;
      letter-spacing: 0.5px;
    }

    .flags-pills-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .flag-toggle-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11.5px;
      font-weight: 600;
      background: var(--paper-strong);
      border: 1px solid var(--line);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }

    .flag-toggle-pill input {
      display: none;
    }

    .flag-toggle-pill.active {
      background: var(--teal);
      color: #fff;
      border-color: var(--teal);
    }

    /* ⚡ 内嵌实时验证靶场 (Live Tester) */
    .tester-area {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tester-input {
      width: 100%;
      height: 90px;
      background: var(--input-bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      resize: vertical;
      outline: none;
      line-height: 1.5;
    }

    .tester-input:focus {
      border-color: var(--teal);
    }

    .tester-status-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      background: var(--paper-strong);
      border: 1px solid var(--line);
    }

    .tester-status-banner.match {
      background: rgba(16, 185, 129, 0.12);
      color: #10b981;
      border-color: rgba(16, 185, 129, 0.3);
    }

    .tester-status-banner.nomatch {
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.3);
    }

    .tester-highlight-preview {
      max-height: 120px;
      overflow-y: auto;
      background: var(--input-bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-size: 12.5px;
      line-height: 1.6;
      word-break: break-all;
      white-space: pre-wrap;
    }

    .tester-highlight-preview mark {
      background: rgba(42, 157, 143, 0.3);
      border-bottom: 2px solid var(--teal);
      border-radius: 2px;
      padding: 1px 2px;
      color: inherit;
      font-weight: bold;
    }

    /* 大白话解析列表 */
    .explainer-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .explainer-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      line-height: 1.5;
    }

    .explainer-step-num {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(42, 157, 143, 0.15);
      color: var(--teal);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* 抽屉样式 (配方库与多语言代码) */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-panel {
      position: fixed;
      top: 0;
      right: -420px;
      width: 420px;
      height: 100vh;
      background: var(--paper);
      border-left: 1px solid var(--line);
      box-shadow: -8px 0 24px rgba(0, 0, 0, 0.15);
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .drawer-panel.open {
      right: 0;
    }

    .drawer-header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
    }

    .drawer-title {
      font-size: 14.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .preset-card {
      background: var(--paper-strong);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.15s;
    }

    .preset-card:hover {
      border-color: var(--teal);
      transform: translateY(-1px);
    }

    .preset-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .preset-desc {
      font-size: 11.5px;
      color: var(--muted);
    }

    .code-block {
      background: var(--input-bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 10px;
      font-family: inherit;
      font-size: 11.5px;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* 底部状态栏 (32px) */
    .workbench-status-bar {
      height: 32px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--paper);
      border-top: 1px solid var(--line);
      font-size: 11.5px;
      color: var(--muted);
      z-index: 10;
    }

    .status-left, .status-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status-item strong {
      color: var(--text);
    }

    /* 全局 Toast */
    .toast {
      position: fixed;
      bottom: 42px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: var(--bg);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1024px) {
      body {
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
      }
      .workbench-main {
        height: auto;
        grid-template-columns: 1fr;
      }
      .col-builder {
        height: 520px;
        border-right: none;
        border-bottom: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>

  <!-- 顶部导航条 (56px) -->
  <header class="workbench-header">
    <div class="header-left">
      <a href="../index.html" class="back-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>返回</span>
      </a>
      <div class="tool-title">
        <span>正则积木工坊</span>
        <span class="badge-pill">Regex Builder v2.0</span>
      </div>
    </div>

    <div class="header-center">
      <button class="nav-btn" onclick="openPresetsDrawer()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        <span>📚 常用配方 (15+)</span>
      </button>

      <button class="nav-btn" onclick="openCodeDrawer()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
        <span>💻 导出调用代码</span>
      </button>

      <button class="nav-btn primary" onclick="openInRegexStudio()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        <span>🚀 导入高级测试器</span>
      </button>
    </div>

    <div class="header-right">
      <button class="nav-btn" onclick="clearAllRules()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        <span>清空</span>
      </button>
    </div>
  </header>

  <!-- 主工作区双栏 -->
  <main class="workbench-main">

    <!-- 左栏：规则链可视化拼装工坊 -->
    <div class="col-builder">
      <div class="builder-toolbar">
        <span>规则链拼装序列 (RULE STEPS)</span>
        <span id="step-count-tip" style="font-size: 11.5px; color: var(--muted); font-weight: normal;">共 0 步匹配</span>
      </div>

      <div class="builder-body">
        <div id="ruleList" style="display: flex; flex-direction: column; gap: 10px;">
          <!-- 动态卡片 -->
        </div>

        <button class="add-step-btn" onclick="addRuleStep()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span>添加匹配条件步 (Add Step)</span>
        </button>
      </div>
    </div>

    <!-- 右栏：生成大盘、内嵌即时靶场与大白话解释 -->
    <div class="col-preview">

      <!-- 卡片 1: 生成的正则表达式 -->
      <div class="preview-card">
        <div class="preview-card-header">
          <span class="preview-card-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            <span>生成的正则表达式</span>
          </span>
          <button class="nav-btn" style="padding: 3px 8px; font-size: 11px;" onclick="copyRegexResult()">复制正则</button>
        </div>

        <div class="regex-big-box" id="regexResult">/(空)/</div>

        <!-- 修饰符与边界设置胶囊组 -->
        <div class="flags-pills-row">
          <span style="font-size: 11.5px; color: var(--muted); margin-right: 4px;">边界与标志：</span>
          <label class="flag-toggle-pill" id="pill-anchor-start" onclick="toggleAnchor('start')">
            <input type="checkbox" id="anchoredStart">
            <span>^ 匹配开头</span>
          </label>
          <label class="flag-toggle-pill" id="pill-anchor-end" onclick="toggleAnchor('end')">
            <input type="checkbox" id="anchoredEnd">
            <span>$ 匹配结尾</span>
          </label>
          <label class="flag-toggle-pill active" id="pill-flag-g" onclick="toggleFlag('g')">
            <input type="checkbox" id="flagG" checked>
            <span>g 全局匹配</span>
          </label>
          <label class="flag-toggle-pill" id="pill-flag-i" onclick="toggleFlag('i')">
            <input type="checkbox" id="flagI">
            <span>i 忽略大小写</span>
          </label>
          <label class="flag-toggle-pill" id="pill-flag-m" onclick="toggleFlag('m')">

  <!-- 全局 Toast -->

  <script>
    // 规则链核心数据状态
    let rules = [];

    // 常用实战配方清单 (15+ 种经典场景)
    const PRESET_RECIPES = [

        ]
      },
      {
        id: 'price_currency',
        name: '💰 货币金额 (带可选两位小数)',
        desc: '至少1位整数金额，接可选的句点和1~2位小数',
        sample: '售价 199 元，折扣价 49.90 元，免运费。',
        anchors: { start: false, end: false },
        steps: [
          { logic: 'and', type: 'digits', quantifier: 'one_more', exclude: false },
          { logic: 'and', type: 'text', value: '.', quantifier: 'optional', exclude: false },

        ]

      {

        name: '🌐 简版 IPv4 地址 (格式验证)',

          { logic: 'and', type: 'digits', quantifier: 'range', minNum: 1, maxNum: 3, exclude: false },

      },
      {

        sample: '欢迎访问 开发者工坊 (Developer Studio)！',
        anchors: { start: false, end: false },
        steps: [
          { logic: 'and', type: 'chinese', quantifier: 'one_more', exclude: false }
        ]
      },
      {
        id: 'url_http',
        name: '🔗 HTTP/HTTPS 网址前缀',
        desc: 'http:// 或 https:// 协议开头，接主机域名',
        sample: '官网网址：https://www.example.com/api?v=1',
        anchors: { start: false, end: false },
        steps: [
          { logic: 'and', type: 'text', value: 'http', quantifier: 'once', exclude: false },
          { logic: 'and', type: 'text', value: 's', quantifier: 'optional', exclude: false },
          { logic: 'and', type: 'text', value: '://', quantifier: 'once', exclude: false },
          { logic: 'and', type: 'custom', value: 'a-zA-Z0-9.-', quantifier: 'one_more', exclude: false }
        ]
      },
      {
        id: 'wechat_id',
        name: '💬 微信号规则',
        desc: '以字母开头，接 5-19 位字母、数字、下划线或减号',
        sample: '微信号：wx_user123 或 dev-admin99。',
        anchors: { start: true, end: true },
        steps: [
          { logic: 'and', type: 'letters', quantifier: 'once', exclude: false },
          { logic: 'and', type: 'custom', value: 'a-zA-Z0-9_-', quantifier: 'range', minNum: 5, maxNum: 19, exclude: false }
        ]
      },
      {
        id: 'postal_code',
        name: '📮 中国邮政编码 (6位)',
        desc: '首位 1-9，接 5 位任意数字',
        sample: '邮编：100000 (北京)，200000 (上海)。',
        anchors: { start: true, end: true },
        steps: [
          { logic: 'and', type: 'custom', value: '1-9', quantifier: 'once', exclude: false },
          { logic: 'and', type: 'digits', quantifier: 'exact', exactNum: 5, exclude: false }
        ]
      }
    ];

    // 初始化
    window.addEventListener('DOMContentLoaded', () => {
      // 默认载入“手机号”配方，让初次进入即有丰满内容
      loadPresetRecipe('phone_cn');
      renderPresetsDrawerList();
    });

    // 添加新规则步
    function addRuleStep(customObj = null) {
      const defaultStep = {
        logic: 'and', // 'and' 或 'or'
        type: 'digits', // 'digits', 'letters', 'alphanumeric', 'chinese', 'whitespace', 'boundary', 'any', 'text', 'custom'
        value: '',
        exclude: false,
        quantifier: 'once', // 'once', 'optional', 'zero_more', 'one_more', 'exact', 'range'
        lazy: false,
        exactNum: 1,
        minNum: 1,
        maxNum: 2,
        disabled: false
      };

      rules.push(customObj ? { ...defaultStep, ...customObj } : defaultStep);
      renderRulesList();
      buildAndRunRegex();
    }

    // 渲染规则链 DOM
    function renderRulesList() {
      const container = document.getElementById('ruleList');
      if (rules.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 40px 20px; color: var(--muted); border: 2px dashed var(--line); border-radius: var(--radius-sm);">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 8px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
            <div>当前积木链为空，点击下方添加匹配步，或从顶部载入经典配方。</div>
          </div>`;
        document.getElementById('step-count-tip').textContent = '共 0 步匹配';
        document.getElementById('bar-rules-count').textContent = '0 步';
        return;
      }

      document.getElementById('step-count-tip').textContent = `共 ${rules.length} 步匹配`;
      document.getElementById('bar-rules-count').textContent = `${rules.length} 步`;

      let html = '';
      rules.forEach((rule, idx) => {
        const isFirst = (idx === 0);
        const isLast = (idx === rules.length - 1);
        const showValueField = (rule.type === 'text' || rule.type === 'custom');
        const showExact = (rule.quantifier === 'exact');
        const showRange = (rule.quantifier === 'range');

        html += `
          <div class="rule-card ${rule.disabled ? 'disabled' : ''}" id="rule-card-${idx}">
            <div class="rule-row-main">
              <span class="rule-index-badge">${idx + 1}</span>

              ${!isFirst ? `
                <select class="logic-select" onchange="updateRuleProp(${idx}, 'logic', this.value)">
                  <option value="and" ${rule.logic === 'and' ? 'selected' : ''}>且 AND</option>
                  <option value="or" ${rule.logic === 'or' ? 'selected' : ''}>或 OR</option>
                </select>
              ` : ''}

              <select class="type-select" onchange="updateRuleProp(${idx}, 'type', this.value)">
                <option value="digits" ${rule.type === 'digits' ? 'selected' : ''}>🔢 数字字符 [0-9]</option>
                <option value="letters" ${rule.type === 'letters' ? 'selected' : ''}>🔤 英文字母 [a-zA-Z]</option>
                <option value="alphanumeric" ${rule.type === 'alphanumeric' ? 'selected' : ''}>🔣 字母与数字 [a-zA-Z0-9]</option>
                <option value="chinese" ${rule.type === 'chinese' ? 'selected' : ''}>🇨🇳 汉字/中文 [\\u4e00-\\u9fa5]</option>
                <option value="whitespace" ${rule.type === 'whitespace' ? 'selected' : ''}>🌫️ 空白字符 (\\s)</option>
                <option value="boundary" ${rule.type === 'boundary' ? 'selected' : ''}>🚧 单词边界 (\\b)</option>
                <option value="any" ${rule.type === 'any' ? 'selected' : ''}>🔮 任意单个字符 (点 .)</option>
                <option value="text" ${rule.type === 'text' ? 'selected' : ''}>🔏 特定纯文本...</option>
                <option value="custom" ${rule.type === 'custom' ? 'selected' : ''}>🗂️ 自定义字符集 [...]</option>
              </select>

              <input type="text"
                     class="value-input"
                     style="display: ${showValueField ? 'block' : 'none'};"
                     value="${escapeHtml(rule.value)}"
                     placeholder="${rule.type === 'text' ? '例如 @ 或 admin' : '例如 a-z0-9 或 _#-'}"
                     oninput="updateRuleProp(${idx}, 'value', this.value)" />

              <div class="rule-actions">
                <button class="icon-btn" onclick="moveRule(${idx}, -1)" title="上移" ${isFirst ? 'disabled style="opacity:0.3;"' : ''}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"></polyline></svg>
                </button>
                <button class="icon-btn" onclick="moveRule(${idx}, 1)" title="下移" ${isLast ? 'disabled style="opacity:0.3;"' : ''}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </button>
                <button class="icon-btn" onclick="cloneRule(${idx})" title="复制本步">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </button>
                <button class="icon-btn" onclick="toggleDisableRule(${idx})" title="${rule.disabled ? '启用' : '临时停用'}">
                  ${rule.disabled ? '👁️‍🗨️' : '👁️'}
                </button>
                <button class="icon-btn danger" onclick="deleteRule(${idx})" title="删除">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
              </div>
            </div>

            <!-- 第二行：修饰与频次 -->
            <div class="rule-row-sub">
              <label class="checkbox-label" title="匹配所选内容以外的字符">
                <input type="checkbox" ${rule.exclude ? 'checked' : ''} onchange="updateRuleProp(${idx}, 'exclude', this.checked)">
                <span>🚫 排除/取反 (Not)</span>
              </label>

              <div class="quantifier-group">
                <span style="color: var(--muted);">频次:</span>
                <select class="quantifier-select" onchange="updateRuleProp(${idx}, 'quantifier', this.value)">
                  <option value="once" ${rule.quantifier === 'once' ? 'selected' : ''}>恰好 1 次</option>
                  <option value="optional" ${rule.quantifier === 'optional' ? 'selected' : ''}>可选 (0 或 1 次 ?)</option>
                  <option value="zero_more" ${rule.quantifier === 'zero_more' ? 'selected' : ''}>0 次或多次 (*)</option>
                  <option value="one_more" ${rule.quantifier === 'one_more' ? 'selected' : ''}>至少 1 次 (+)</option>
                  <option value="exact" ${rule.quantifier === 'exact' ? 'selected' : ''}>精确 N 次 {n}</option>
                  <option value="range" ${rule.quantifier === 'range' ? 'selected' : ''}>区间范围 {n,m}</option>
                </select>

                <input type="number"
                       class="num-input"
                       style="display: ${showExact ? 'inline-block' : 'none'};"
                       value="${rule.exactNum}"
                       min="1" max="999"
                       oninput="updateRuleProp(${idx}, 'exactNum', parseInt(this.value) || 1)">
                <span style="display: ${showExact ? 'inline' : 'none'};">次</span>

                <span style="display: ${showRange ? 'inline' : 'none'};">在</span>
                <input type="number"
                       class="num-input"
                       style="display: ${showRange ? 'inline-block' : 'none'};"
                       value="${rule.minNum}"
                       min="0" max="999"
                       oninput="updateRuleProp(${idx}, 'minNum', parseInt(this.value) || 0)">
                <span style="display: ${showRange ? 'inline' : 'none'};">至</span>
                <input type="number"
                       class="num-input"
                       style="display: ${showRange ? 'inline-block' : 'none'};"
                       value="${rule.maxNum}"
                       min="1" max="999"
                       oninput="updateRuleProp(${idx}, 'maxNum', parseInt(this.value) || 1)">
                <span style="display: ${showRange ? 'inline' : 'none'};">次</span>
              </div>

              <label class="checkbox-label" title="开启非贪婪匹配模式 (匹配尽可能短的字符串)">
                <input type="checkbox" ${rule.lazy ? 'checked' : ''} onchange="updateRuleProp(${idx}, 'lazy', this.checked)">
                <span>非贪婪 (?)</span>
              </label>
            </div>
          </div>`;
      });

      container.innerHTML = html;
    }

    function updateRuleProp(idx, key, val) {
      rules[idx][key] = val;
      if (key === 'type' || key === 'quantifier') {
        renderRulesList();
      }
      buildAndRunRegex();
    }

    function moveRule(idx, dir) {
      const target = idx + dir;
      if (target < 0 || target >= rules.length) return;
      const temp = rules[idx];
      rules[idx] = rules[target];
      rules[target] = temp;
      renderRulesList();
      buildAndRunRegex();
    }

    function cloneRule(idx) {
      const copy = JSON.parse(JSON.stringify(rules[idx]));
      rules.splice(idx + 1, 0, copy);
      renderRulesList();
      buildAndRunRegex();
      showToast('已复制该匹配步骤');
    }

    function toggleDisableRule(idx) {
      rules[idx].disabled = !rules[idx].disabled;
      renderRulesList();
      buildAndRunRegex();
    }

    function deleteRule(idx) {
      rules.splice(idx, 1);
      renderRulesList();
      buildAndRunRegex();
    }

    function clearAllRules() {
      rules = [];
      renderRulesList();
      buildAndRunRegex();
      showToast('积木链已清空');
    }

    // 核心组装正则表达式并运行即时靶场
    function buildAndRunRegex() {
      const activeRules = rules.filter(r => !r.disabled);

      if (activeRules.length === 0) {
        document.getElementById('regexResult').textContent = '/(空)/';
        document.getElementById('bar-regex-len').textContent = '0 字符';
        document.getElementById('explainerList').innerHTML = '<div style="color: var(--muted); font-size: 12px; padding: 12px 0;">添加至少一个有效步骤以生成解析</div>';
        updateLiveTesterResult(null);
        return;
      }

      let regexBody = '';
      const explainerSteps = [];

      activeRules.forEach((rule, idx) => {
        let atom = '';
        let typeText = '';

        switch (rule.type) {
          case 'digits':
            atom = rule.exclude ? '\\D' : '\\d';
            typeText = rule.exclude ? '非数字字符' : '数字 [0-9]';
            break;
          case 'letters':
            atom = rule.exclude ? '[^a-zA-Z]' : '[a-zA-Z]';
            typeText = rule.exclude ? '非英文字母' : '英文字母 [a-zA-Z]';
            break;
          case 'alphanumeric':
            atom = rule.exclude ? '[^a-zA-Z0-9]' : '[a-zA-Z0-9]';
            typeText = rule.exclude ? '非字母与数字' : '字母与数字 [a-zA-Z0-9]';
            break;
          case 'chinese':
            atom = rule.exclude ? '[^\\u4e00-\\u9fa5]' : '[\\u4e00-\\u9fa5]';
            typeText = rule.exclude ? '非中文字符' : '中文字符 (汉字)';
            break;
          case 'whitespace':
            atom = rule.exclude ? '\\S' : '\\s';
            typeText = rule.exclude ? '非空白字符' : '空白字符 (\\s)';
            break;
          case 'boundary':
            atom = '\\b';
            typeText = '单词边界 (\\b)';
            break;
          case 'any':
            atom = '.';
            typeText = '任意单个字符 (.)';
            break;
          case 'text':
            const esc = escapeRegexMeta(rule.value || '');
            atom = rule.exclude ? `[^${esc}]` : esc;
            typeText = rule.exclude ? `除了 "${rule.value || '空'}" 以外` : `纯文本 "${rule.value || '空'}"`;
            break;
          case 'custom':
            const inner = rule.value || '';
            atom = rule.exclude ? `[^${inner}]` : `[${inner}]`;
            typeText = rule.exclude ? `字符集 [^${inner}]` : `字符集 [${inner}]`;
            break;
        }

        // 处理量词
        let quantStr = '';
        let freqText = '';
        const isMultiCharText = (rule.type === 'text' && rule.value && rule.value.length > 1 && !rule.exclude);
        const baseAtom = isMultiCharText && rule.quantifier !== 'once' ? `(?:${atom})` : atom;
        const lazySign = rule.lazy ? '?' : '';

        switch (rule.quantifier) {
          case 'once':
            quantStr = baseAtom;
            freqText = '恰好 1 次';
            break;
          case 'optional':
            quantStr = baseAtom + '?' + lazySign;
            freqText = `可选 0 或 1 次${rule.lazy ? ' (非贪婪)' : ''}`;
            break;
          case 'zero_more':
            quantStr = baseAtom + '*' + lazySign;
            freqText = `0 次或多次${rule.lazy ? ' (非贪婪)' : ''}`;
            break;
          case 'one_more':
            quantStr = baseAtom + '+' + lazySign;
            freqText = `至少 1 次${rule.lazy ? ' (非贪婪)' : ''}`;
            break;
          case 'exact':
            quantStr = `${baseAtom}{${rule.exactNum}}` + lazySign;
            freqText = `精确 ${rule.exactNum} 次`;
            break;
          case 'range':
            quantStr = `${baseAtom}{${rule.minNum},${rule.maxNum}}` + lazySign;
            freqText = `${rule.minNum} 到 ${rule.maxNum} 次之间`;
            break;
        }

        // 拼接逻辑
        if (idx > 0) {
          if (rule.logic === 'or') {
            regexBody += '|' + quantStr;
            explainerSteps.push({ num: idx + 1, text: `<strong>或者逻辑分支 (OR)</strong>：匹配【${typeText}】，频次【${freqText}】` });
          } else {
            regexBody += quantStr;
            explainerSteps.push({ num: idx + 1, text: `<strong>紧随其后匹配</strong>【${typeText}】，频次【${freqText}】` });
          }
        } else {
          regexBody += quantStr;
          explainerSteps.push({ num: idx + 1, text: `<strong>从首部开始匹配</strong>【${typeText}】，频次【${freqText}】` });
        }
      });

      // 边界包裹
      const isStart = document.getElementById('anchoredStart').checked;
      const isEnd = document.getElementById('anchoredEnd').checked;
      const fullPattern = (isStart ? '^' : '') + regexBody + (isEnd ? '$' : '');

      // Flags
      let flags = '';
      if (document.getElementById('flagG').checked) flags += 'g';
      if (document.getElementById('flagI').checked) flags += 'i';
      if (document.getElementById('flagM').checked) flags += 'm';
      if (document.getElementById('flagS').checked) flags += 's';

      const fullRegexText = `/${fullPattern}/${flags}`;
      document.getElementById('regexResult').textContent = fullRegexText;
      document.getElementById('bar-regex-len').textContent = `${fullPattern.length} 字符`;

      // 渲染大白话流程
      let expHtml = '';
      explainerSteps.forEach(s => {
        expHtml += `
          <div class="explainer-item">
            <span class="explainer-step-num">${s.num}</span>
            <span>${s.text}</span>
          </div>`;
      });
      document.getElementById('explainerList').innerHTML = expHtml;

      // 运行即时测试靶场
      try {
        const regexObj = new RegExp(fullPattern, flags);
        updateLiveTesterResult(regexObj);
      } catch (e) {
        updateLiveTesterResult(null);
      }
    }

    // ⚡ 内嵌实时验证靶场运算
    function runLiveTester() {
      buildAndRunRegex();
    }

    function updateLiveTesterResult(regex) {
      const text = document.getElementById('testerInput').value;
      const statusBanner = document.getElementById('testerStatusBanner');
      const statusText = document.getElementById('testerStatusText');
      const countText = document.getElementById('testerCountText');
      const preview = document.getElementById('testerHighlightPreview');
      const barStatus = document.getElementById('bar-tester-status');

      if (!regex || !text) {
        statusBanner.className = 'tester-status-banner';
        statusText.textContent = text ? '正则表达式等待有效步骤' : '输入测试样本以检验规则';
        countText.textContent = '0 处命中';
        preview.textContent = text || '--';
        barStatus.textContent = '就绪';
        barStatus.style.color = 'var(--muted)';
        return;
      }

      // 执行测试与高亮标记
      const matches = [];
      let m;
      const isG = regex.global;
      let safe = 0;

      if (isG) {
        regex.lastIndex = 0;
        while ((m = regex.exec(text)) !== null) {
          if (m.index === regex.lastIndex) regex.lastIndex++;
          matches.push({ start: m.index, end: m.index + m[0].length, val: m[0] });
          safe++;
          if (safe > 3000) break;
        }
      } else {
        m = regex.exec(text);
        if (m) {
          matches.push({ start: m.index, end: m.index + m[0].length, val: m[0] });
        }
      }

      if (matches.length > 0) {
        statusBanner.className = 'tester-status-banner match';
        statusText.textContent = '✔ 校验通过：成功命中目标特征！';
        countText.textContent = `${matches.length} 处命中`;
        barStatus.textContent = `命中 ${matches.length} 处`;
        barStatus.style.color = '#10b981';

        // 拼接高亮 DOM
        let last = 0;
        let hlHtml = '';
        matches.forEach(item => {
          hlHtml += escapeHtml(text.substring(last, item.start));
          hlHtml += `<mark>${escapeHtml(item.val)}</mark>`;
          last = item.end;
        });
        hlHtml += escapeHtml(text.substring(last));
        preview.innerHTML = hlHtml;
      } else {
        statusBanner.className = 'tester-status-banner nomatch';
        statusText.textContent = '✘ 未匹配：测试样本中未找到符合规则的内容';
        countText.textContent = '0 处命中';
        preview.textContent = text;
        barStatus.textContent = '未命中';
        barStatus.style.color = '#ef4444';
      }
    }

    // 胶囊开关
    function toggleAnchor(type) {
      if (type === 'start') {
        const cb = document.getElementById('anchoredStart');
        cb.checked = !cb.checked;
        document.getElementById('pill-anchor-start').classList.toggle('active', cb.checked);
      } else {
        const cb = document.getElementById('anchoredEnd');
        cb.checked = !cb.checked;
        document.getElementById('pill-anchor-end').classList.toggle('active', cb.checked);
      }
      buildAndRunRegex();
    }

    function toggleFlag(flag) {
      const id = 'flag' + flag.toUpperCase();
      const pillId = 'pill-flag-' + flag;
      const cb = document.getElementById(id);
      cb.checked = !cb.checked;
      document.getElementById(pillId).classList.toggle('active', cb.checked);
      buildAndRunRegex();
    }

    // 复制正则表达式
    function copyRegexResult() {
      const text = document.getElementById('regexResult').textContent;
      if (!text || text === '/(空)/') return;
      navigator.clipboard.writeText(text).then(() => {
        showToast('已复制正则表达式：' + text);
      });
    }

    // 一键携带当前正则与样本无缝跳转至高级测试器
    function openInRegexStudio() {
      const resText = document.getElementById('regexResult').textContent;
      if (!resText || resText === '/(空)/') {
        showToast('当前无有效生成的正则表达式');
        return;
      }

      // 提取 pattern 与 flags
      const lastSlash = resText.lastIndexOf('/');
      const pattern = resText.substring(1, lastSlash);
      const flags = resText.substring(lastSlash + 1);
      const sample = document.getElementById('testerInput').value;

      const stateObj = {
        p: pattern,
        t: sample,
        r: '',
        f: {
          g: flags.includes('g'),
          i: flags.includes('i'),
          m: flags.includes('m'),
          s: flags.includes('s'),
          u: false,
          y: false
        },
        c: [
          { text: sample.split('\n')[0] || 'test', expectMatch: true }
        ]
      };

      const b64 = btoa(encodeURIComponent(JSON.stringify(stateObj)).replace(/%([0-9A-F]{2})/g, (match, p1) => {
        return String.fromCharCode('0x' + p1);
      }));

      const url = `${window.location.origin}/tool/regex_tool.html#state=${b64}`;
      window.open(url, '_blank');
      showToast('🚀 已在新窗口导入高级测试器！');
    }

    // 配方库抽屉
    function openPresetsDrawer() {
      document.getElementById('presetsDrawerOverlay').classList.add('open');
      document.getElementById('presetsDrawer').classList.add('open');
    }

    function closePresetsDrawer() {
      document.getElementById('presetsDrawerOverlay').classList.remove('open');
      document.getElementById('presetsDrawer').classList.remove('open');
    }

    function renderPresetsDrawerList() {
      const container = document.getElementById('presetsList');
      let html = '';

      PRESET_RECIPES.forEach(r => {
        html += `
          <div class="preset-card" onclick="loadPresetRecipe('${r.id}')">
            <div class="preset-name">${r.name}</div>
            <div class="preset-desc">${r.desc}</div>
          </div>`;
      });

      container.innerHTML = html;
    }

    function loadPresetRecipe(presetId) {
      const item = PRESET_RECIPES.find(p => p.id === presetId);
      if (!item) return;

      // 填充规则
      rules = JSON.parse(JSON.stringify(item.steps));

      // 填充边界
      const cbStart = document.getElementById('anchoredStart');
      const cbEnd = document.getElementById('anchoredEnd');
      cbStart.checked = !!item.anchors.start;
      cbEnd.checked = !!item.anchors.end;
      document.getElementById('pill-anchor-start').classList.toggle('active', cbStart.checked);
      document.getElementById('pill-anchor-end').classList.toggle('active', cbEnd.checked);

      // 填入测试样本
      document.getElementById('testerInput').value = item.sample;

      renderRulesList();
      buildAndRunRegex();
      closePresetsDrawer();
      showToast(`已载入配方：${item.name}`);
    }

    // 多语言调用代码抽屉
    function openCodeDrawer() {
      renderCodeSnippets();
      document.getElementById('codeDrawerOverlay').classList.add('open');
      document.getElementById('codeDrawer').classList.add('open');
    }

    function closeCodeDrawer() {
      document.getElementById('codeDrawerOverlay').classList.remove('open');
      document.getElementById('codeDrawer').classList.remove('open');
    }

    function renderCodeSnippets() {
      const resText = document.getElementById('regexResult').textContent;
      const lastSlash = resText.lastIndexOf('/');
      const pattern = resText.substring(1, lastSlash);
      const flags = resText.substring(lastSlash + 1);

      const list = [
        {
          lang: 'JavaScript / TypeScript',
          code: `const regex = new RegExp(${JSON.stringify(pattern)}, '${flags}');\nconst isMatch = regex.test(text);\nconst matches = text.match(regex);`
        },
        {
          lang: 'Python 3',
          code: `import re\npattern = r'${pattern}'\nmatches = re.findall(pattern, text${flags.includes('i') ? ', re.IGNORECASE' : ''})`
        },
        {
          lang: 'Go (Golang)',
          code: `import (\n    "fmt"\n    "regexp"\n)\nre := regexp.MustCompile(\`${pattern}\`)\nmatches := re.FindAllString(text, -1)`
        },
        {
          lang: 'Java',
          code: `import java.util.regex.*;\nPattern pattern = Pattern.compile("${pattern.replace(/\\/g, '\\\\')}"${flags.includes('i') ? ', Pattern.CASE_INSENSITIVE' : ''});\nMatcher matcher = pattern.matcher(text);`
        },
        {
          lang: 'PHP',
          code: `$pattern = '/${pattern}/${flags}';\npreg_match_all($pattern, $text, $matches);`
        }
      ];

      const container = document.getElementById('codeSnippetsList');
      let html = '';
      list.forEach(item => {
        html += `
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span style="font-size: 12px; font-weight: 700; color: var(--teal);">${item.lang}</span>
              <button class="nav-btn" style="padding: 2px 6px; font-size: 11px;" onclick="copyDirectCode(\`${escapeAttr(item.code)}\`)">复制代码</button>
            </div>
            <pre class="code-block">${escapeHtml(item.code)}</pre>
          </div>`;
      });

      container.innerHTML = html;
    }

    function copyDirectCode(code) {
      navigator.clipboard.writeText(code).then(() => {
        showToast('已复制代码片段');
      });
    }

    function escapeRegexMeta(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttr(str) {
      return str.replace(/`/g, '\\`').replace(/\$/g, '\\$');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2200);
    }
  </script>
