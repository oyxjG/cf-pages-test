<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCV 实时美颜实验室</title>
    <link rel="stylesheet" href="../index.css">
    <style>
        .container { max-width: 900px; margin: 40px auto; padding: 20px; }
        .preview-area { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .box { flex: 1; min-width: 300px; background: #1a1a1a; border-radius: 12px; overflow: hidden; aspect-ratio: 4/3; position: relative; border: 1px solid var(--border); }
        canvas, video { width: 100%; height: 100%; object-fit: cover; background: #000; }
        .label { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); color: white; padding: 4px 10px; border-radius: 4px; font-size: 12px; backdrop-filter: blur(4px); z-index: 5; }
        
        .controls { background: var(--bg-secondary); padding: 24px; border-radius: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; border: 1px solid var(--border); }
        .control-item { display: flex; flex-direction: column; gap: 10px; }
        .control-item label { font-size: 14px; font-weight: 500; display: flex; justify-content: space-between; }
        .control-item label span { color: var(--accent); }
        input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
        
        #status-bar { margin-bottom: 20px; padding: 12px 20px; background: var(--bg-secondary); border-radius: 8px; font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
        .status-dot.active { background: #10b981; box-shadow: 0 0 8px #10b981; }

        .loading-overlay { position: fixed; inset: 0; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; text-align: center; }
        .loader-spinner { width: 50px; height: 50px; border: 4px solid #eee; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .button.secondary { background: transparent; border: 1px solid #251c15; color: #251c15; transition: all 0.2s; }
        .button.secondary:hover { background: rgba(37, 28, 21, 0.05); transform: translateY(-1px); }
        .button-group { margin-top: 30px; display: flex; gap: 12px; }
    </style>
</head>
<body>
    <div id="loader" class="loading-overlay">
        <div class="loader-spinner"></div>
        <div class="badge">Performance Optimized</div>
        <h2 style="margin: 15px 0;">正在启动美颜实验室...</h2>
        <p class="muted">已加载本地 OpenCV 核心库</p>
    </div>

    <div class="container">
        <div class="section-head">
            <div>
                <div class="badge">Pure Beauty</div>
                <h3>高级美颜实验室</h3>
            </div>
            <p class="muted">实时视频流双边滤波算法，专注于自然磨皮与光感调节。</p>
        </div>

        <div id="status-bar">
            <div id="status-dot" class="status-dot"></div>
            <span id="status-text">视觉引擎准备中...</span>
        </div>

        <div class="preview-area">
            <div class="box">
                <video id="videoInput" autoplay playsinline muted></video>
                <div class="label">原始视频</div>
            </div>
            <div class="box">
                <canvas id="canvasOutput"></canvas>
                <div class="label">美颜预览</div>
            </div>
        </div>

        <div class="controls">
            <div class="control-item">
                <label>磨皮强度 <span><span id="val-smooth">5</span></span></label>
                <input type="range" id="smooth" min="1" max="15" value="5">
            </div>
            <div class="control-item">
                <label>光感亮度 <span><span id="val-bright">1.1</span>x</span></label>
                <input type="range" id="bright" min="0.5" max="2.0" step="0.1" value="1.1">
            </div>
            <div class="control-item">
                <label>肤色饱和 <span><span id="val-saturate">1.2</span>x</span></label>
                <input type="range" id="saturate" min="0.5" max="2.0" step="0.1" value="1.2">
            </div>
            <div class="control-item">
                <label>细节锐化 <span><span id="val-sharpen">0.2</span></span></label>
                <input type="range" id="sharpen" min="0" max="2" step="0.1" value="0.2">
            </div>
        </div>

        <div class="button-group">
            <button class="button primary" id="toggleStream" disabled>正在初始化...</button>
            <a href="../index.html" class="button secondary">返回首页</a>
        </div>
    </div>

    <script async src="../lib/opencv.js"></script>

    <script>
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const startBtn = document.getElementById('toggleStream');
        
        function onEngineReady() {
            if (window.engineIsReady) return;
            window.engineIsReady = true;
            document.getElementById('loader').style.display = 'none';
            
            // 自动开启时，初始状态同步
            startBtn.disabled = false;
            startBtn.innerText = '关闭实时美颜';
            startStreaming();
        }

        var Module = { onRuntimeInitialized() { onEngineReady(); } };
        setInterval(() => { if (typeof cv !== 'undefined' && cv.Mat) onEngineReady(); }, 500);

        let streaming = false, video = document.getElementById('videoInput');
        let src, srcRGB, smallRGB, dstSmallRGB, dstRGB, temp, cap, animationId;

        async function startStreaming() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    video.width = video.videoWidth;
                    video.height = video.videoHeight;
                    streaming = true;
                    
                    // 同步状态栏
                    statusDot.classList.add('active');
                    statusText.innerText = '实时美颜处理中 (高性能模式)';
                    
                    processVideo();
                };
            } catch (err) { 
                statusText.innerText = '错误: ' + err.message;
                statusDot.classList.remove('active');
            }
        }

        function processVideo() {
            if (!streaming || typeof cv === 'undefined' || !cv.Mat) return;
            try {
                if (!src) {
                    const w = video.width, h = video.height;
                    src = new cv.Mat(h, w, cv.CV_8UC4);
                    srcRGB = new cv.Mat(h, w, cv.CV_8UC3);
                    smallRGB = new cv.Mat(h/2, w/2, cv.CV_8UC3);
                    dstSmallRGB = new cv.Mat(h/2, w/2, cv.CV_8UC3);
                    dstRGB = new cv.Mat(h, w, cv.CV_8UC3);
                    temp = new cv.Mat();
                    cap = new cv.VideoCapture(video);
                }

                cap.read(src);
                cv.cvtColor(src, srcRGB, cv.COLOR_RGBA2RGB);
                cv.resize(srcRGB, smallRGB, new cv.Size(video.width/2, video.height/2));

                let smoothVal = parseInt(document.getElementById('smooth').value) * 2 + 1;
                cv.bilateralFilter(smallRGB, dstSmallRGB, smoothVal, 50, 50);
                
                let bright = parseFloat(document.getElementById('bright').value);
                dstSmallRGB.convertTo(dstSmallRGB, -1, bright, 0);

                cv.resize(dstSmallRGB, dstRGB, new cv.Size(video.width, video.height));

                let sharpen = parseFloat(document.getElementById('sharpen').value);
                if (sharpen > 0) {
                    cv.GaussianBlur(dstRGB, temp, new cv.Size(0,0), 3);
                    cv.addWeighted(dstRGB, 1+sharpen, temp, -sharpen, 0, dstRGB);
                }

                cv.imshow('canvasOutput', dstRGB);
                updateUI();
                animationId = requestAnimationFrame(processVideo);
            } catch (err) { console.error(err); }
        }

        function updateUI() {
            document.getElementById('val-smooth').innerText = document.getElementById('smooth').value;
            document.getElementById('val-bright').innerText = document.getElementById('bright').value;
            document.getElementById('val-saturate').innerText = document.getElementById('saturate').value;
            document.getElementById('val-sharpen').innerText = document.getElementById('sharpen').value;
        }

        startBtn.onclick = function() {
            if (!streaming) {
                startStreaming();
                this.innerText = '关闭实时美颜';
            } else {
                streaming = false;
                cancelAnimationFrame(animationId);
                if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
                
                // 完全同步关闭状态
                this.innerText = '开启实时美颜';
                statusText.innerText = '处理已停止';
                statusDot.classList.remove('active');
            }
        };
    </script>
</body>
</html>
