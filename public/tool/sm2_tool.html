<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SM2 国密解密工具</title>
  <link rel="stylesheet" href="../theme.css">
  <script src="../theme.js"></script>
  <script src="sm2_lib.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "Avenir Next", "PingFang SC", system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, var(--grad-start) 0%, var(--bg) 100%);
      color: var(--text);
      overflow: hidden;
    }

    /* 顶部导航与工具栏 */
    .top-navbar {
      height: 56px;
      min-height: 56px;
      background: var(--paper);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 16px;
      z-index: 50;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-link {
      text-decoration: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      background: transparent;
    }

    .back-link:hover {
      color: var(--accent);
      background: var(--paper-strong);
    }

    .app-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .app-title h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent), #d38d48);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .app-title .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 99px;
      background: var(--btn-secondary-bg);
      color: var(--muted);
      border: 1px solid var(--line);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* 工具按钮 */
    .btn {
      height: 34px;
      padding: 0 16px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--paper-strong);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      user-select: none;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--paper);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--accent);
      color: var(--btn-text);
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent);
      filter: brightness(1.1);
      color: var(--btn-text);
      box-shadow: 0 4px 12px rgba(191, 91, 50, 0.25);
    }

    .btn-primary:disabled {
      background: #a8a29e;
      border-color: #a8a29e;
      cursor: not-allowed;
      box-shadow: none;
      filter: none;
    }

    /* 布局切换胶囊 */
    .segmented-control {
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }

    .seg-btn {
      border: none;
      background: transparent;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .seg-btn:hover {
      color: var(--text);
    }

    .seg-btn.active {
      background: var(--paper-strong);
      color: var(--accent);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    /* 主工作台区域 */
    .workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      padding: 12px;
      gap: 0;
      box-sizing: border-box;
      position: relative;
    }

    /* 左右布局（默认） */
    .workspace.layout-horizontal {
      flex-direction: row;
    }

    /* 上下布局 */
    .workspace.layout-vertical {
      flex-direction: column;
    }

    /* 拖拽调节分割条 */
    .resizer {
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: background 0.15s ease;
      user-select: none;
    }

    .layout-horizontal .resizer {
      width: 10px;
      cursor: col-resize;
      margin: 0 1px;
    }

    .layout-vertical .resizer {
      height: 10px;
      cursor: row-resize;
      margin: 1px 0;
    }

    .resizer-line {
      background: var(--line);
      border-radius: 2px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .layout-horizontal .resizer-line {
      width: 2px;
      height: 40px;
    }

    .layout-vertical .resizer-line {
      height: 2px;
      width: 40px;
    }

    .resizer:hover .resizer-line,
    .resizer.is-dragging .resizer-line {
      background: var(--accent);
      transform: scale(1.5);
    }

    body.resizing-h {
      cursor: col-resize !important;
      user-select: none !important;
    }

    body.resizing-v {
      cursor: row-resize !important;
      user-select: none !important;
    }

    /* 面板结构 */
    .panel {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      backdrop-filter: blur(15px);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    /* 默认左右布局分栏尺寸（优化默认宽度 380px，防止按钮挤压折行） */
    .layout-horizontal .panel-input {
      width: 380px;
      flex-shrink: 0;
    }

    .layout-horizontal .panel-output {
      flex: 1;
      min-width: 0;
    }

    /* 上下布局分栏尺寸（输入区高度较小） */
    .layout-vertical .panel-input {
      height: 150px;
      flex-shrink: 0;
    }

    .layout-vertical .panel-output {
      flex: 1;
      min-height: 0;
    }

    /* 收起左侧面板状态 */
    .workspace.sidebar-collapsed .panel-input,
    .workspace.sidebar-collapsed .resizer {
      display: none !important;
    }

    .panel-header {
      height: 42px;
      min-height: 42px;
      padding: 0 14px;
      background: var(--paper-strong);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      white-space: nowrap;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
    }

    .panel-title .badge {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      background: var(--input-bg);
      padding: 1px 6px;
      border-radius: 4px;
      text-transform: none;
      letter-spacing: 0;
      flex-shrink: 0;
    }

    .panel-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .action-link {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      user-select: none;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .action-link:hover {
      color: var(--accent);
      background: var(--btn-secondary-bg);
    }

    .action-divider {
      width: 1px;
      height: 14px;
      background: var(--line);
      margin: 0 2px;
    }

    .panel-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--input-bg);
    }

    /* 输入区文本框 */
    .cipher-textarea {
      width: 100%;
      height: 100%;
      padding: 16px;
      border: none;
      background: transparent;
      font-family: "Fira Code", "Consolas", monospace;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text);
      resize: none;
      outline: none;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .cipher-textarea::placeholder {
      color: var(--muted);
      opacity: 0.6;
    }

    /* 结果展示区容器 */
    .result-container {
      width: 100%;
      height: 100%;
      padding: 16px 20px;
      overflow: auto;
      outline: none;
      font-family: "Fira Code", "Consolas", monospace;
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--text);
    }

    .result-raw {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-all;
      font-family: inherit;
    }

    /* JSON 树形渲染与缩进虚线体系 */
    .json-tree {
      display: block;
      font-family: "Fira Code", "Consolas", monospace;
      user-select: text;
    }

    .json-node {
      position: relative;
    }

    /* 行容器与整行悬浮高亮 */
    .json-row {
      display: flex;
      align-items: baseline;
      padding: 2px 6px;
      margin: 0 -6px;
      border-radius: 4px;
      white-space: pre-wrap;
      word-break: break-all;
      transition: background 0.12s ease;
    }

    .json-row:hover {
      background: rgba(84, 66, 49, 0.05);
    }

    [data-theme="dark"] .json-row:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    /* 缩进子层级容器与纵向对齐虚线 */
    .json-fold-content {
      display: block;
      margin-left: 8px;
      padding-left: 16px;
      border-left: 1px dashed var(--line);
      transition: border-color 0.2s ease;
    }

    .json-fold-content:hover {
      border-left-color: rgba(191, 91, 50, 0.35);
    }

    [data-theme="dark"] .json-fold-content:hover {
      border-left-color: rgba(224, 122, 95, 0.45);
    }

    /* 三角折叠指示器（优化放大与热区） */
    .json-toggle {
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      margin-right: 4px;
      color: var(--muted);
      opacity: 0.85;
      transition: transform 0.15s ease, opacity 0.15s ease, color 0.15s ease;
      flex-shrink: 0;
      vertical-align: middle;
      border-radius: 3px;
    }

    .json-toggle:hover {
      opacity: 1;
      color: var(--accent);
      background: rgba(191, 91, 50, 0.1);
    }

    .json-toggle svg {
      width: 13.5px;
      height: 13.5px;
      transition: transform 0.15s ease;
    }

    /* 折叠状态处理 */
    .json-collapsible.collapsed > .json-node-header .json-toggle svg {
      transform: rotate(-90deg);
    }

    .json-collapsible.collapsed > .json-fold-content {
      display: none;
    }

    .json-collapsible.collapsed > .json-node-footer {
      display: none;
    }

    /* 折叠占位提示胶囊 */
    .json-placeholder-badge {
      display: none;
      background: rgba(191, 91, 50, 0.1);
      color: var(--accent);
      padding: 0 7px;
      border-radius: 4px;
      font-size: 11.5px;
      margin: 0 6px;
      cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      vertical-align: middle;
      font-weight: 500;
      border: 1px dashed rgba(191, 91, 50, 0.3);
      user-select: none;
    }

    .json-placeholder-badge:hover {
      background: var(--accent);
      color: #fff;
    }

    .json-collapsible.collapsed > .json-node-header .json-placeholder-badge {
      display: inline-block;
    }

    .json-closing-bracket-collapsed {
      display: none;
    }

    .json-collapsible.collapsed > .json-node-header .json-closing-bracket-collapsed {
      display: inline;
    }

    /* 语法高亮着色 */
    .json-key { color: var(--berry); font-weight: 600; }
    .json-string { color: var(--teal); }
    .json-string-link {
      color: var(--teal);
      text-decoration: underline;
      text-decoration-style: dotted;
      cursor: pointer;
    }
    .json-string-link:hover {
      text-decoration-style: solid;
      color: var(--accent);
    }
    .json-number { color: var(--mustard); font-weight: 600; }
    .json-boolean { color: var(--accent); font-weight: 700; }
    .json-null { color: var(--muted); font-style: italic; opacity: 0.85; }
    .json-punct { color: var(--muted); opacity: 0.9; }

    /* 空状态提示 */
    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 12px;
      pointer-events: none;
      user-select: none;
    }

    .empty-state svg {
      opacity: 0.35;
    }

    .empty-state p {
      margin: 0;
      font-size: 13px;
      opacity: 0.7;
    }

    /* 错误提示横幅 */
    .error-banner {
      background: rgba(220, 38, 38, 0.08);
      border-top: 1px solid rgba(220, 38, 38, 0.2);
      color: #dc2626;
      padding: 10px 16px;
      font-size: 13px;
      display: none;
      align-items: center;
      justify-content: space-between;
    }

    [data-theme="dark"] .error-banner {
      background: rgba(239, 68, 68, 0.15);
      border-top-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    /* 耗时徽章 */
    .time-badge {
      font-size: 12px;
      color: var(--teal);
      background: var(--input-bg);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--line);
      font-family: monospace;
      display: none;
    }

    /* 复制轻提示 */
    .toast-tip {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--text);
      color: var(--bg);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      pointer-events: none;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    .toast-tip.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Loading Spinner */
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 响应式调整 */
    @media (max-width: 768px) {
      .top-navbar {
        padding: 0 12px;
      }
      .app-title h1 {
        font-size: 16px;
      }
      .app-title .tag {
        display: none;
      }
      .workspace {
        flex-direction: column !important;
        padding: 8px;
      }
      .panel-input {
        width: 100% !important;
        height: 140px !important;
      }
      .resizer {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- 顶部导航与工具栏 -->
  <header class="top-navbar">
    <div class="nav-left">
      <a href="../index.html" class="back-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        返回首页
      </a>
      <div class="app-title">
        <h1>SM2 国密解密工具</h1>
        <span class="tag">国密标准 SM2 / 异步 Worker</span>
      </div>
    </div>

    <div class="nav-right">
      <span id="timeStats" class="time-badge"></span>

      <!-- 执行解密主按钮 -->
      <button id="runBtn" class="btn btn-primary" onclick="handleDecrypt()" title="快捷键: Ctrl + Enter">
        <div id="loader" class="spinner"></div>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        <span>执行解密</span>
      </button>

      <!-- 布局切换 -->
      <div class="segmented-control">
        <button id="btnLayoutH" class="seg-btn active" onclick="setLayout('horizontal')" title="左右并排展示">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
          左右
        </button>
        <button id="btnLayoutV" class="seg-btn" onclick="setLayout('vertical')" title="上下堆叠展示">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="12" x2="21" y2="12"></line></svg>
          上下
        </button>
      </div>
    </div>
  </header>

  <!-- 工作台分栏区域 -->
  <main id="workspace" class="workspace layout-horizontal">
    
    <!-- 左侧面板：待解密密文输入 -->
    <section id="panelLeft" class="panel panel-input">
      <div class="panel-header">
        <div class="panel-title">
          <span>待解密密文 (HEX)</span>
          <span id="cipherCount" class="badge">0 字符</span>
        </div>
        <div class="panel-actions">
          <button class="action-link" onclick="pasteFromClipboard()" title="从剪贴板粘贴">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
            粘贴
          </button>
          <button class="action-link" onclick="clearInput()" title="清空输入框">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            清空
          </button>
          <button class="action-link" onclick="toggleSidebar(false)" title="收起密文输入栏以全屏查看明文">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
            收起
          </button>
        </div>
      </div>
      <div class="panel-body">
        <textarea 
          id="cipherInput" 
          class="cipher-textarea" 
          placeholder="请输入或粘贴 04 开头的十六进制 SM2 密文...&#10;支持快捷键 Ctrl + Enter 快速解密"
          oninput="handleInputChange()"
          onkeydown="handleInputKeyDown(event)"></textarea>
      </div>
      <div id="errorArea" class="error-banner"></div>
    </section>

    <!-- 拖拽调节分割条 -->
    <div id="splitResizer" class="resizer" title="按住鼠标拖拽调节左右/上下分栏比例">
      <div class="resizer-line"></div>
    </div>

    <!-- 右侧面板：解密明文结果 -->
    <section id="panelRight" class="panel panel-output">
      <div class="panel-header">
        <div class="panel-title">
          <button id="btnExpandSidebar" class="action-link" onclick="toggleSidebar(true)" style="display: none; margin-right: 4px; color: var(--accent);" title="重新展开密文输入栏">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
            展开密文栏
          </button>
          <span>解密明文结果</span>
          <span id="resultTypeBadge" class="badge" style="display: none;">JSON</span>
        </div>
        <div class="panel-actions">
          <!-- JSON 专属功能按钮 -->
          <div id="jsonActions" style="display: none; align-items: center; gap: 4px;">
            <button class="action-link" onclick="expandAll()" title="展开所有节点">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="7 13 12 18 17 13"></polyline><polyline points="7 6 12 11 17 6"></polyline></svg>
              展开
            </button>
            <button class="action-link" onclick="collapseAll()" title="折叠所有节点">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 11 12 6 7 11"></polyline><polyline points="17 18 12 13 7 18"></polyline></svg>
              折叠
            </button>
            <button class="action-link" onclick="toggleCompress()" title="压缩为单行 JSON">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="12" x2="20" y2="12"></line></svg>
              压缩
            </button>
            <div class="action-divider"></div>
          </div>
          
          <button class="action-link" onclick="copyPlainResult()" title="复制明文结果">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            复制
          </button>
        </div>
      </div>
      <div class="panel-body">
        <div id="emptyState" class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <p>在左侧输入密文并点击“执行解密”</p>
        </div>
        
        <div id="outputContainer" class="result-container" tabindex="0" onkeydown="handleResultKeyDown(event)" onclick="handleRenderClick(event)">
          <!-- JSON 树形渲染容器 或 纯文本展示 -->
          <div id="jsonTreeRender" class="json-tree"></div>
          <pre id="outputRaw" class="result-raw" style="display: none;"></pre>
        </div>
      </div>
    </section>

  </main>

  <div id="toastTip" class="toast-tip">已复制到剪贴板</div>

  <!-- Worker 脚本定义 -->
  <script id="worker-code" type="javascript/worker">
    self.onmessage = function(e) {
      const { cipher, privKey, libCode } = e.data;
      try {
        const module = { exports: {} };
        const exports = module.exports;
        (new Function('module', 'exports', libCode))(module, exports);
        const sm2 = module.exports || self.sm2;

        if (!sm2 || typeof sm2.doDecrypt !== 'function') {
          throw new Error("解密引擎加载失败");
        }

        const start = performance.now();
        const plain = sm2.doDecrypt(cipher, privKey);
        const end = performance.now();

        self.postMessage({ success: true, data: plain, time: (end - start).toFixed(2) });
      } catch (err) {
        self.postMessage({ success: false, error: err.message });
      }
    };
  </script>

  <script>
    const DEFAULT_PRIV_KEY = "4e8e840cf91fbd024c6c47cecd86bcd1e13b27f6eeeba833e65a3929ba883e6a";
    let parsedJsonData = null;
    let rawPlainResult = "";
    let isCompressed = false;
    let currentLayout = 'horizontal';

    const panelLeft = document.getElementById('panelLeft');
    const resizer = document.getElementById('splitResizer');
    const btnExpandSidebar = document.getElementById('btnExpandSidebar');
    const workspace = document.getElementById('workspace');

    // 三角指示器 SVG 图标
    const TRIANGLE_ICON = `<span class="json-toggle" title="展开/收起"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg></span>`;

    // 平台快捷键自动检测 (Mac 显示 ⌘, Win/Linux 显示 Ctrl)
    const isMac = /Mac|iPod|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
    const modKey = isMac ? '⌘' : 'Ctrl';

    // 初始化布局与分栏尺寸记忆
    (function initLayoutAndSizes() {
      // 适配快捷键提示文案
      const runBtn = document.getElementById('runBtn');
      const cipherInput = document.getElementById('cipherInput');
      if (runBtn) runBtn.title = `快捷键: ${modKey} + Enter`;
      if (cipherInput) {
        cipherInput.placeholder = `请输入或粘贴 04 开头的十六进制 SM2 密文...\n支持快捷键 ${modKey} + Enter 快速解密`;
      }

      const savedLayout = localStorage.getItem('sm2_tool_layout') || 'horizontal';
      setLayout(savedLayout, false);

      const savedWidth = localStorage.getItem('sm2_tool_left_width');
      if (savedWidth && savedLayout === 'horizontal') {
        panelLeft.style.width = savedWidth + 'px';
      }

      const savedHeight = localStorage.getItem('sm2_tool_top_height');
      if (savedHeight && savedLayout === 'vertical') {
        panelLeft.style.height = savedHeight + 'px';
      }

      initResizerDrag();
    })();

    function setLayout(mode, save = true) {
      currentLayout = mode;
      const ws = document.getElementById('workspace');
      const btnH = document.getElementById('btnLayoutH');
      const btnV = document.getElementById('btnLayoutV');

      if (mode === 'vertical') {
        ws.classList.remove('layout-horizontal');
        ws.classList.add('layout-vertical');
        btnV.classList.add('active');
        btnH.classList.remove('active');

        // 应用垂直模式高度记忆
        panelLeft.style.width = '';
        const savedHeight = localStorage.getItem('sm2_tool_top_height') || '150';
        panelLeft.style.height = savedHeight + 'px';
      } else {
        ws.classList.remove('layout-vertical');
        ws.classList.add('layout-horizontal');
        btnH.classList.add('active');
        btnV.classList.remove('active');

        // 应用水平模式宽度记忆
        panelLeft.style.height = '';
        const savedWidth = localStorage.getItem('sm2_tool_left_width') || '380';
        panelLeft.style.width = savedWidth + 'px';
      }

      if (save) {
        localStorage.setItem('sm2_tool_layout', mode);
      }
    }

    // --- 分割线自由拖拽引擎 ---
    function initResizerDrag() {
      let isDragging = false;
      let startX, startY, startSize;

      resizer.addEventListener('mousedown', (e) => {
        isDragging = true;
        resizer.classList.add('is-dragging');

        if (currentLayout === 'horizontal') {
          document.body.classList.add('resizing-h');
          startX = e.clientX;
          startSize = panelLeft.getBoundingClientRect().width;
        } else {
          document.body.classList.add('resizing-v');
          startY = e.clientY;
          startSize = panelLeft.getBoundingClientRect().height;
        }

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
        e.preventDefault();
      });

      function onMouseMove(e) {
        if (!isDragging) return;

        if (currentLayout === 'horizontal') {
          const deltaX = e.clientX - startX;
          let newWidth = startSize + deltaX;
          const minWidth = 280;
          const maxWidth = window.innerWidth * 0.7;

          if (newWidth < minWidth) newWidth = minWidth;
          if (newWidth > maxWidth) newWidth = maxWidth;

          panelLeft.style.width = `${newWidth}px`;
          localStorage.setItem('sm2_tool_left_width', Math.round(newWidth));
        } else {
          const deltaY = e.clientY - startY;
          let newHeight = startSize + deltaY;
          const minHeight = 90;
          const maxHeight = window.innerHeight * 0.6;

          if (newHeight < minHeight) newHeight = minHeight;
          if (newHeight > maxHeight) newHeight = maxHeight;

          panelLeft.style.height = `${newHeight}px`;
          localStorage.setItem('sm2_tool_top_height', Math.round(newHeight));
        }
      }

      function onMouseUp() {
        if (!isDragging) return;
        isDragging = false;
        resizer.classList.remove('is-dragging');
        document.body.classList.remove('resizing-h', 'resizing-v');
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      }
    }

    // 收起 / 展开左侧密文输入栏
    function toggleSidebar(expand) {
      if (expand) {
        workspace.classList.remove('sidebar-collapsed');
        btnExpandSidebar.style.display = 'none';
        showToast('已展开密文输入栏');
      } else {
        workspace.classList.add('sidebar-collapsed');
        btnExpandSidebar.style.display = 'inline-flex';
        showToast('已收起密文输入栏，明文全屏展示');
      }
    }

    function handleInputChange() {
      const input = document.getElementById('cipherInput').value;
      const count = input.replace(/\s+/g, '').length;
      document.getElementById('cipherCount').innerText = `${count} 字符`;
    }

    function handleInputKeyDown(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        handleDecrypt();
      }
    }

    function handleResultKeyDown(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
        e.preventDefault();
        const container = parsedJsonData ? document.getElementById('jsonTreeRender') : document.getElementById('outputRaw');
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(container);
        selection.removeAllRanges();
        selection.addRange(range);
      }
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          const inputEl = document.getElementById('cipherInput');
          inputEl.value = text.trim();
          handleInputChange();
          showToast('已从剪贴板粘贴');
        }
      } catch (err) {
        showToast('无法访问剪贴板，请手动粘贴');
      }
    }

    function clearInput() {
      document.getElementById('cipherInput').value = '';
      handleInputChange();
      document.getElementById('errorArea').style.display = 'none';
      document.getElementById('cipherInput').focus();
    }

    function showToast(msg) {
      const tip = document.getElementById('toastTip');
      tip.innerText = msg;
      tip.classList.add('show');
      setTimeout(() => tip.classList.remove('show'), 1500);
    }

    async function copyPlainResult() {
      let text = "";
      if (parsedJsonData !== null) {
        text = isCompressed ? JSON.stringify(parsedJsonData) : JSON.stringify(parsedJsonData, null, 2);
      } else {
        text = rawPlainResult;
      }

      if (!text) {
        showToast('暂无解密内容可复制');
        return;
      }
      
      try {
        await navigator.clipboard.writeText(text);
        showToast('已复制纯净内容到剪贴板');
      } catch (err) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('已复制纯净内容到剪贴板');
      }
    }

    // --- JSON 树形渲染与多层折叠引擎 ---
    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function isHttpUrl(str) {
      return typeof str === 'string' && /^https?:\/\//i.test(str);
    }

    function formatValue(val) {
      if (val === null) return '<span class="json-null">null</span>';
      if (typeof val === 'number') return `<span class="json-number">${val}</span>`;
      if (typeof val === 'boolean') return `<span class="json-boolean">${val}</span>`;
      if (typeof val === 'string') {
        const escaped = escapeHtml(val);
        if (isHttpUrl(val)) {
          return `<span class="json-string">"<a class="json-string-link" href="${escaped}" target="_blank" rel="noopener noreferrer">${escaped}</a>"</span>`;
        }
        return `<span class="json-string">"${escaped}"</span>`;
      }
      return '';
    }

    function renderJSONTree(val, key = null, isLast = true) {
      const isComplex = val !== null && typeof val === 'object';
      const keyPrefix = key !== null ? `<span class="json-key">"${escapeHtml(key)}"</span><span class="json-punct">: </span>` : '';
      const comma = isLast ? '' : '<span class="json-punct">,</span>';

      if (!isComplex) {
        return `<div class="json-row">${keyPrefix}${formatValue(val)}${comma}</div>`;
      }

      const isArray = Array.isArray(val);
      const openBrace = isArray ? '[' : '{';
      const closeBrace = isArray ? ']' : '}';
      const keys = isArray ? val : Object.keys(val);
      const count = isArray ? val.length : keys.length;

      if (count === 0) {
        return `<div class="json-row">${keyPrefix}<span class="json-punct">${openBrace}${closeBrace}</span>${comma}</div>`;
      }

      const placeholder = isArray ? `Array(${count})` : `Object{${count}}`;

      let html = `<div class="json-node json-collapsible" data-placeholder="${placeholder}">`;
      
      // Header 行
      html += `<div class="json-row json-node-header">`;
      html += `${TRIANGLE_ICON}`;
      html += `${keyPrefix}<span class="json-punct">${openBrace}</span>`;
      html += `<span class="json-placeholder-badge">${placeholder}</span>`;
      html += `<span class="json-closing-bracket-collapsed json-punct">${closeBrace}${comma}</span>`;
      html += `</div>`;

      // 展开的子内容（左侧带有虚线）
      html += `<div class="json-fold-content">`;
      if (isArray) {
        val.forEach((item, idx) => {
          html += renderJSONTree(item, null, idx === val.length - 1);
        });
      } else {
        const objKeys = Object.keys(val);
        objKeys.forEach((k, idx) => {
          html += renderJSONTree(val[k], k, idx === objKeys.length - 1);
        });
      }
      html += `</div>`;

      // Footer 闭合行
      html += `<div class="json-row json-node-footer">`;
      html += `<span class="json-punct">${closeBrace}</span>${comma}`;
      html += `</div>`;

      html += `</div>`;
      return html;
    }

    // 折叠与展开点击事件捕获
    function handleRenderClick(e) {
      const toggle = e.target.closest('.json-toggle');
      const badge = e.target.closest('.json-placeholder-badge');
      if (toggle || badge) {
        const collapsible = (toggle || badge).closest('.json-collapsible');
        if (collapsible) {
          collapsible.classList.toggle('collapsed');
        }
      }
    }

    // 全部展开
    function expandAll() {
      const collapsibles = document.querySelectorAll('#jsonTreeRender .json-collapsible');
      collapsibles.forEach(el => el.classList.remove('collapsed'));
      showToast('已全部展开');
    }

    // 全部折叠（仅保留最外层）
    function collapseAll() {
      const collapsibles = document.querySelectorAll('#jsonTreeRender .json-collapsible');
      collapsibles.forEach((el, index) => {
        if (index > 0) { // 保留最外层，折叠所有子节点
          el.classList.add('collapsed');
        }
      });
      showToast('已折叠所有子节点');
    }

    // 切换压缩单行
    function toggleCompress() {
      if (!parsedJsonData) return;
      isCompressed = !isCompressed;
      const treeContainer = document.getElementById('jsonTreeRender');
      const rawContainer = document.getElementById('outputRaw');

      if (isCompressed) {
        treeContainer.style.display = 'none';
        rawContainer.style.display = 'block';
        rawContainer.textContent = JSON.stringify(parsedJsonData);
        showToast('已压缩为单行');
      } else {
        rawContainer.style.display = 'none';
        treeContainer.style.display = 'block';
        treeContainer.innerHTML = renderJSONTree(parsedJsonData);
        showToast('已还原展开视图');
      }
    }

    async function handleDecrypt() {
      let input = document.getElementById('cipherInput').value.trim();
      const btn = document.getElementById('runBtn');
      const loader = document.getElementById('loader');
      const errArea = document.getElementById('errorArea');
      const emptyState = document.getElementById('emptyState');
      const treeContainer = document.getElementById('jsonTreeRender');
      const rawContainer = document.getElementById('outputRaw');
      const stats = document.getElementById('timeStats');
      const jsonBadge = document.getElementById('resultTypeBadge');
      const jsonActions = document.getElementById('jsonActions');

      if (!input) {
        showError("请输入待解密的十六进制密文");
        return;
      }

      // 去除空格和换行
      input = input.replace(/\s+/g, '');

      // Reset UI
      errArea.style.display = 'none';
      btn.disabled = true;
      loader.style.display = 'block';
      isCompressed = false;

      try {
          // 处理 04 前缀
          const cipher = input.startsWith('04') ? input.slice(2) : input;

          // 从本地引入库源码
          const libCode = SM2_WORKER_CODE;
          
          // 启动 Worker
          const workerCode = document.getElementById('worker-code').textContent;
          const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
          const worker = new Worker(URL.createObjectURL(workerBlob));

          worker.onmessage = (e) => {
            const res = e.data;
            btn.disabled = false;
            loader.style.display = 'none';

            if (res.success) {
              emptyState.style.display = 'none';
              stats.style.display = 'inline-block';
              stats.innerText = `耗时: ${res.time}ms`;
              rawPlainResult = res.data;
              
              try {
                parsedJsonData = JSON.parse(res.data);
                treeContainer.innerHTML = renderJSONTree(parsedJsonData);
                treeContainer.style.display = 'block';
                rawContainer.style.display = 'none';
                
                jsonBadge.style.display = 'inline-block';
                jsonActions.style.display = 'inline-flex';
              } catch (err) {
                parsedJsonData = null;
                rawContainer.textContent = res.data;
                rawContainer.style.display = 'block';
                treeContainer.style.display = 'none';
                
                jsonBadge.style.display = 'none';
                jsonActions.style.display = 'none';
              }
            } else {
              showError("解密失败: " + res.error);
            }
            worker.terminate();
          };

          worker.onerror = (e) => {
            btn.disabled = false;
            loader.style.display = 'none';
            showError("Worker 线程异常，请检查密文格式是否合法。");
            worker.terminate();
          };

          worker.postMessage({ cipher, privKey: DEFAULT_PRIV_KEY, libCode });

      } catch (err) {
        btn.disabled = false;
        loader.style.display = 'none';
        showError(err.message);
      }
    }

    function showError(msg) {
      const area = document.getElementById('errorArea');
      area.innerText = msg;
      area.style.display = 'flex';
    }
  </script>
</body>
