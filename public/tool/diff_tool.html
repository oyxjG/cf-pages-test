<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diff 文本对比工具 - 个人聚合面板</title>
  <link rel="stylesheet" href="../theme.css">
  <script src="../theme.js"></script>
  <style>
    :root {
      --diff-del-bg: color-mix(in srgb, var(--accent) 12%, transparent);
      --diff-del-text: #b84a26;
      --diff-del-char-bg: color-mix(in srgb, var(--accent) 26%, transparent);
      
      --diff-ins-bg: color-mix(in srgb, var(--teal) 12%, transparent);
      --diff-ins-text: #1b5e53;
      --diff-ins-char-bg: color-mix(in srgb, var(--teal) 26%, transparent);
    }

    [data-theme="dark"] {
      --diff-del-bg: color-mix(in srgb, var(--accent) 16%, transparent);
      --diff-del-text: #ff9e80;
      --diff-del-char-bg: color-mix(in srgb, var(--accent) 34%, transparent);
      
      --diff-ins-bg: color-mix(in srgb, var(--teal) 16%, transparent);
      --diff-ins-text: #a7ffeb;
      --diff-ins-char-bg: color-mix(in srgb, var(--teal) 34%, transparent);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "Avenir Next", "PingFang SC", system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, var(--grad-start) 0%, var(--bg) 100%);
      color: var(--text);
      overflow: hidden;
    }

    /* 顶部导航与工具栏 */
    .top-navbar {
      height: 56px;
      min-height: 56px;
      background: var(--paper);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 16px;
      z-index: 50;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .back-link {
      text-decoration: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      background: transparent;
    }

    .back-link:hover {
      color: var(--accent);
      background: var(--paper-strong);
    }

    .app-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .app-title h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent), #d38d48);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .app-title .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 99px;
      background: var(--btn-secondary-bg);
      color: var(--muted);
      border: 1px solid var(--line);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: nowrap;
    }

    /* 通用按钮 */
    .btn {
      height: 34px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--paper-strong);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      user-select: none;
      white-space: nowrap;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--paper);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--accent);
      color: var(--btn-text);
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent);
      filter: brightness(1.1);
      color: var(--btn-text);
      box-shadow: 0 4px 12px rgba(191, 91, 50, 0.25);
    }

    /* 选项开关/复选胶囊 */
    .checkbox-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      height: 32px;
      background: var(--input-bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }

    .checkbox-pill:hover {
      border-color: var(--accent);
    }

    .checkbox-pill input {
      accent-color: var(--accent);
      cursor: pointer;
      margin: 0;
    }

    /* 布局切换胶囊 */
    .segmented-control {
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }

    .seg-btn {
      border: none;
      background: transparent;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .seg-btn:hover {
      color: var(--text);
    }

    .seg-btn.active {
      background: var(--paper-strong);
      color: var(--accent);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    /* 主工作台区域 - 占满全屏 */
    .workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 12px;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* 输入区双栏容器 */
    .inputs-wrapper {
      display: flex;
      gap: 12px;
      height: 220px;
      min-height: 120px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .inputs-wrapper.collapsed {
      height: 0 !important;
      min-height: 0 !important;
      margin-bottom: -12px;
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
    }

    /* 面板结构 */
    .panel {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      backdrop-filter: blur(15px);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      height: 40px;
      min-height: 40px;
      padding: 0 14px;
      background: var(--paper-strong);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-title .badge {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      background: var(--input-bg);
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: none;
      letter-spacing: 0;
      border: 1px solid var(--line);
    }

    .panel-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-link {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 5px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      user-select: none;
      line-height: 1;
    }

    .action-link:hover {
      color: var(--accent);
      background: var(--btn-secondary-bg);
    }

    .action-divider {
      width: 1px;
      height: 14px;
      background: var(--line);
      margin: 0 2px;
    }

    .panel-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--input-bg);
      overflow: hidden;
    }

    /* 输入文本框 */
    .diff-textarea {
      flex: 1;
      width: 100%;
      height: 100%;
      padding: 12px 14px;
      border: none;
      background: transparent;
      font-family: "Fira Code", Consolas, Monaco, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text);
      resize: none;
      outline: none;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      tab-size: 2;
    }

    .diff-textarea::placeholder {
      color: var(--muted);
      opacity: 0.65;
    }

    /* 结果面板 */
    .result-panel {
      flex: 1;
      min-height: 0;
    }

    .diff-legend {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      margin-left: 8px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .legend-color {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      display: inline-block;
    }

    .legend-color.delete {
      background-color: var(--diff-del-bg);
      border: 1px solid var(--diff-del-text);
    }

    .legend-color.insert {
      background-color: var(--diff-ins-bg);
      border: 1px solid var(--diff-ins-text);
    }

    /* 差异对比展示容器 - 滚动区域 */
    .diff-scroll-view {
      flex: 1;
      min-height: 0;
      overflow: auto;
      background: var(--paper-strong);
    }

    .diff-container {
      font-family: "Fira Code", Consolas, Monaco, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.6;
      width: 100%;
      min-width: 100%;
      box-sizing: border-box;
    }

    /* 双栏并排 Diff 表格样式 */
    .diff-container.split {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 48px minmax(0, 1fr);
      width: 100%;
    }

    /* 单栏混排 Diff 表格样式 */
    .diff-container.inline {
      display: grid;
      grid-template-columns: 48px 48px minmax(0, 1fr);
      width: 100%;
    }

    .diff-header-col {
      background-color: color-mix(in srgb, var(--text) 5%, transparent);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 6px 12px;
      border-bottom: 1px solid var(--line);
      letter-spacing: 0.06em;
      user-select: none;
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(8px);
    }

    .diff-header-col.left {
      border-right: 1px solid var(--line);
    }

    .diff-gutter {
      background-color: color-mix(in srgb, var(--text) 3%, transparent);
      color: var(--muted);
      text-align: right;
      padding: 0 8px;
      user-select: none;
      border-right: 1px solid var(--line);
      font-size: 11px;
      line-height: 1.6;
    }

    .diff-code {
      padding: 0 12px;
      min-height: 1.6em;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-wrap: anywhere;
    }

    .diff-code.left {
      border-right: 1px solid var(--line);
    }

    /* 高亮差异行 */
    .diff-row-delete {
      background-color: var(--diff-del-bg);
      color: var(--diff-del-text);
    }

    .diff-row-insert {
      background-color: var(--diff-ins-bg);
      color: var(--diff-ins-text);
    }

    .diff-row-modify-left {
      background-color: color-mix(in srgb, var(--accent) 7%, transparent);
    }

    .diff-row-modify-right {
      background-color: color-mix(in srgb, var(--teal) 7%, transparent);
    }

    .char-delete {
      background-color: var(--diff-del-char-bg);
      color: var(--diff-del-text);
      text-decoration: line-through;
      font-weight: bold;
      border-radius: 2px;
      padding: 1px 2px;
    }

    .char-insert {
      background-color: var(--diff-ins-char-bg);
      color: var(--diff-ins-text);
      text-decoration: underline;
      font-weight: bold;
      border-radius: 2px;
      padding: 1px 2px;
    }

    .empty-line {
      background-color: color-mix(in srgb, var(--text) 2%, transparent);
    }

    /* 逐词/逐字对比视图 */
    .diff-container.token-view {
      display: flex;
      gap: 16px;
      padding: 16px;
      box-sizing: border-box;
      min-height: 100%;
    }

    .diff-token-pane {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .diff-token-pane.left {
      border-right: 1px solid var(--line);
      padding-right: 16px;
    }

    .diff-container.token-view pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-all;
      font-family: inherit;
      font-size: 13.5px;
      line-height: 1.65;
    }

    .pane-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px dashed var(--line);
      padding-bottom: 6px;
      letter-spacing: 0.05em;
    }

    /* 空白状态 */
    .empty-state {
      height: 100%;
      min-height: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 12px;
      user-select: none;
      padding: 40px;
      text-align: center;
    }

    .empty-state svg {
      opacity: 0.4;
    }

    .empty-state p {
      margin: 0;
      font-size: 14px;
      opacity: 0.8;
    }

    .empty-state .sub {
      font-size: 12px;
      opacity: 0.5;
    }

    /* 复制 Toast */
    .toast-tip {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--text);
      color: var(--bg);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      pointer-events: none;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    .toast-tip.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 900px) {
      .app-title .tag {
        display: none;
      }
      .inputs-wrapper {
        flex-direction: column;
        height: 280px;
      }
    }
  </style>
</head>
<body>

  <!-- 顶部导航与工具栏 -->
  <header class="top-navbar">
    <div class="nav-left">
      <a href="../index.html" class="back-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        返回首页
      </a>
      <div class="app-title">
        <h1>Diff 文本对比</h1>
        <span class="tag">并排/单栏 · 逐行/逐词/逐字 · 本地纯前端</span>
      </div>
    </div>

    <div class="nav-right">
      <!-- 载入测试数据 -->
      <button class="btn" onclick="loadSampleDiff()" title="载入测试用的代码对比示例">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <span>示例</span>
      </button>

      <!-- 交换左右两边 -->
      <button class="btn" onclick="swapTexts()" title="交换原文本与修改后文本">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m16 3 4 4-4 4"></path><path d="M20 7H4"></path><path d="m8 21-4-4 4-4"></path><path d="M4 17h16"></path></svg>
        <span>交换</span>
      </button>

      <!-- 忽略选项 -->
      <label class="checkbox-pill" title="对比时忽略首尾或连续空格差异">
        <input type="checkbox" id="ignoreWhitespace" onchange="performDiff()" checked />
        <span>忽略空白</span>
      </label>
      <label class="checkbox-pill" title="对比时忽略英文字母大小写差异">
        <input type="checkbox" id="ignoreCase" onchange="performDiff()" />
        <span>忽略大小写</span>
      </label>

      <!-- 立即比对主按钮 -->
      <button class="btn btn-primary" onclick="performDiff()" title="立即对比差异 (Ctrl + Enter)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        <span>比对 (Diff)</span>
      </button>

      <!-- 主题切换按钮 (由 theme.js 自动接管) -->
      <button id="theme-toggle" class="btn" style="padding: 0 10px;" title="切换明亮/暗黑主题">
        <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
    </div>
  </header>

  <!-- 全屏工作台 -->
  <main class="workspace">

    <!-- 上半部分：原文本与修改后文本输入区 (可一键折叠铺满) -->
    <div id="inputsSection" class="inputs-wrapper">
      
      <!-- 原文本面板 -->
      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">
            <span>原版本 (Original)</span>
            <span id="origStats" class="badge">0 行 / 0 字</span>
          </div>
          <div class="panel-actions">
            <label class="action-link" style="cursor: pointer;" title="导入本地文件">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
              导入
              <input type="file" id="fileImportOriginal" style="display: none;" onchange="importFile('originalText', this)" />
            </label>
            <div class="action-divider"></div>
            <button class="action-link" onclick="clearEditor('originalText')" title="清空原文本">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
              清空
            </button>
          </div>
        </div>
        <div class="panel-body">
          <textarea 
            id="originalText" 
            class="diff-textarea" 
            placeholder="在此输入、粘贴或拖入原版本文本/代码..." 
            oninput="handleInputChange('originalText')" 
            spellcheck="false"></textarea>
        </div>
      </section>

      <!-- 修改后文本面板 -->
      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">
            <span>修改后 (Modified)</span>
            <span id="modStats" class="badge">0 行 / 0 字</span>
          </div>
          <div class="panel-actions">
            <label class="action-link" style="cursor: pointer;" title="导入本地文件">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
              导入
              <input type="file" id="fileImportModified" style="display: none;" onchange="importFile('modifiedText', this)" />
            </label>
            <div class="action-divider"></div>
            <button class="action-link" onclick="clearEditor('modifiedText')" title="清空修改后文本">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
              清空
            </button>
          </div>
        </div>
        <div class="panel-body">
          <textarea 
            id="modifiedText" 
            class="diff-textarea" 
            placeholder="在此输入、粘贴或拖入修改后新版本文本/代码..." 
            oninput="handleInputChange('modifiedText')" 
            spellcheck="false"></textarea>
        </div>
      </section>

    </div>

    <!-- 下半部分：对比分析结果面板 (自适应撑满剩余屏幕) -->
    <section class="panel result-panel">
      <div class="panel-header">
        <div class="panel-title">
          <span>差异分析结果</span>
          <span id="diffSummaryBadge" class="badge" style="display: none;">无差异</span>
          <div class="diff-legend" id="diffLegend" style="display: none;">
            <span class="legend-item"><span class="legend-color delete"></span> 删除</span>
            <span class="legend-item"><span class="legend-color insert"></span> 新增</span>
          </div>
        </div>

        <div class="panel-actions">
          <!-- 视图模式胶囊 -->
          <div class="segmented-control" id="viewModeGroup">
            <button class="seg-btn active" data-value="split" onclick="setViewMode('split')" title="双栏左右并排对比">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
              并排
            </button>
            <button class="seg-btn" data-value="inline" onclick="setViewMode('inline')" title="单栏合并混排对比">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="12" x2="21" y2="12"></line></svg>
              单栏
            </button>
          </div>

          <!-- 对比粒度胶囊 -->
          <div class="segmented-control" id="diffTypeGroup">
            <button class="seg-btn active" data-value="line" onclick="setDiffType('line')" title="逐行对比">行</button>
            <button class="seg-btn" data-value="word" onclick="setDiffType('word')" title="逐词对比">词</button>
            <button class="seg-btn" data-value="char" onclick="setDiffType('char')" title="逐字对比">字</button>
          </div>

          <div class="action-divider"></div>

          <!-- 折叠/展开输入区，让对比结果铺满整个视口 -->
          <button id="toggleInputsBtn" class="action-link" onclick="toggleInputs()" title="折叠/展开上方输入区，使结果铺满屏幕">
            <svg id="toggleInputsIcon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"></polyline></svg>
            <span id="toggleInputsText">折叠输入</span>
          </button>

          <div class="action-divider"></div>

          <!-- 复制修改后文本 -->
          <button class="action-link" onclick="copyResult()" title="复制右侧修改后完整文本">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            复制新文本
          </button>
        </div>
      </div>

      <!-- 对比内容独立滚动区 -->
      <div class="diff-scroll-view" id="diffScrollView">
        <div id="diffOutput">
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <p>在上方输入原文本与修改后的文本，系统将在此展现精准对比差异</p>
            <span class="sub">支持快捷键 Ctrl + Enter 快速比对，也可点击右上角“示例”快速体验</span>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- 轻量轻提示 Toast -->
  <div id="toast" class="toast-tip">已复制到剪贴板</div>

  <!-- 引入 jsdiff 库 -->
  <script src="/vendor/diff.min.js"></script>
  <script>
    let diffDebounceTimer;
    let currentViewMode = 'split';
    let currentDiffType = 'line';
    let isInputsCollapsed = false;

    // 载入示例测试数据
    function loadSampleDiff() {
      const sampleOrig = `function getUserProfile(userId) {
  // 从数据库中查找用户信息
  const user = db.find({ id: userId });
  if (!user) {
    return { status: 404, message: "User not found" };
  }
  return {
    id: user.id,
    name: user.name,
    role: "member"
  };
}`;

      const sampleMod = `async function getUserProfile(userId) {
  // 从数据库中异步查找用户信息并附带缓存
  const user = await db.findById(userId);
  if (!user) {
    throw new NotFoundError("User not found: " + userId);
  }
  return {
    id: user.id,
    name: user.name,
    role: user.role || "guest",
    avatar: user.avatarUrl,
    updatedAt: new Date().toISOString()
  };
}`;

      document.getElementById('originalText').value = sampleOrig;
      document.getElementById('modifiedText').value = sampleMod;
      updateTextStats('originalText');
      updateTextStats('modifiedText');
      performDiff();
      showToast('已加载对比示例数据');
    }

    // 统计文本行数与字符数
    function updateTextStats(id) {
      const val = document.getElementById(id).value;
      const statsId = id === 'originalText' ? 'origStats' : 'modStats';
      const statsEl = document.getElementById(statsId);
      if (!val) {
        statsEl.textContent = '0 行 / 0 字';
        return;
      }
      const lines = val.split('\n').length;
      const chars = val.length;
      statsEl.textContent = `${lines} 行 / ${chars} 字`;
    }

    function handleInputChange(id) {
      updateTextStats(id);
      debounceDiff();
    }

    // 折叠/展开输入区
    function toggleInputs() {
      const section = document.getElementById('inputsSection');
      const text = document.getElementById('toggleInputsText');
      const icon = document.getElementById('toggleInputsIcon');
      isInputsCollapsed = !isInputsCollapsed;

      if (isInputsCollapsed) {
        section.classList.add('collapsed');
        text.textContent = '展开输入';
        icon.innerHTML = '<polyline points="6 9 12 15 18 9"></polyline>';
      } else {
        section.classList.remove('collapsed');
        text.textContent = '折叠输入';
        icon.innerHTML = '<polyline points="18 15 12 9 6 15"></polyline>';
      }
    }

    function setViewMode(mode) {
      document.querySelectorAll('#viewModeGroup .seg-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.value === mode);
      });
      currentViewMode = mode;
      performDiff();
    }

    function setDiffType(type) {
      document.querySelectorAll('#diffTypeGroup .seg-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.value === type);
      });
      currentDiffType = type;
      performDiff();
    }

    function clearEditor(id) {
      document.getElementById(id).value = '';
      updateTextStats(id);
      performDiff();
    }

    function swapTexts() {
      const orig = document.getElementById('originalText');
      const mod = document.getElementById('modifiedText');
      const temp = orig.value;
      orig.value = mod.value;
      mod.value = temp;
      updateTextStats('originalText');
      updateTextStats('modifiedText');
      performDiff();
      showToast('已交换两边文本');
    }

    function debounceDiff() {
      clearTimeout(diffDebounceTimer);
      const origLen = document.getElementById('originalText').value.length;
      const modLen = document.getElementById('modifiedText').value.length;
      const totalLen = origLen + modLen;

      if (totalLen > 100000) {
        return; // 超大文本需手动点击“比对”
      }

      const delay = totalLen > 30000 ? 500 : 150;
      diffDebounceTimer = setTimeout(performDiff, delay);
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 1800);
    }

    function copyResult() {
      const newText = document.getElementById('modifiedText').value;
      if (!newText) {
        showToast('修改后文本为空');
        return;
      }
      navigator.clipboard.writeText(newText).then(() => {
        showToast('已复制新版本文本到剪贴板');
      });
    }

    function performDiff() {
      const oldText = document.getElementById('originalText').value;
      const newText = document.getElementById('modifiedText').value;
      const diffOutput = document.getElementById('diffOutput');
      const diffLegend = document.getElementById('diffLegend');
      const diffSummaryBadge = document.getElementById('diffSummaryBadge');

      if (!oldText && !newText) {
        diffOutput.innerHTML = `
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <p>在上方输入原文本与修改后的文本，系统将在此展现精准对比差异</p>
            <span class="sub">支持快捷键 Ctrl + Enter 快速比对，也可点击右上角“示例”快速体验</span>
          </div>
        `;
        if (diffLegend) diffLegend.style.display = 'none';
        if (diffSummaryBadge) diffSummaryBadge.style.display = 'none';
        return;
      }

      if (diffLegend) diffLegend.style.display = 'flex';
      if (diffSummaryBadge) diffSummaryBadge.style.display = 'inline-block';

      const options = {
        ignoreCase: document.getElementById('ignoreCase').checked,
        ignoreWhitespace: document.getElementById('ignoreWhitespace').checked
      };

      try {
        if (typeof Diff === 'undefined') {
          diffOutput.innerHTML = `<div class="empty-state" style="color: var(--accent);"><p>jsdiff 库加载中，请稍候...</p></div>`;
          return;
        }

        if (currentDiffType === 'line') {
          const diffResult = Diff.diffLines(oldText, newText, options);
          renderLineDiff(diffResult, currentViewMode, options);
        } else if (currentDiffType === 'word') {
          const diffResult = Diff.diffWords(oldText, newText, options);
          renderTokenDiff(diffResult, currentViewMode, 'word');
        } else {
          const diffResult = Diff.diffChars(oldText, newText, options);
          renderTokenDiff(diffResult, currentViewMode, 'char');
        }
      } catch (e) {
        diffOutput.innerHTML = `<div class="empty-state" style="color: var(--accent);"><p>比对出错: ${e.message}</p></div>`;
      }
    }

    function renderLineDiff(diffResult, viewMode, options) {
      const diffOutput = document.getElementById('diffOutput');
      const diffSummaryBadge = document.getElementById('diffSummaryBadge');

      let blocks = [];
      let currentChange = { removed: [], added: [] };
      let totalAdded = 0;
      let totalRemoved = 0;

      for (let part of diffResult) {
        let lines = part.value.split(/\r?\n/);
        if (lines.length > 1 && lines[lines.length - 1] === '') {
          lines.pop();
        }
        if (part.removed) {
          currentChange.removed.push(...lines);
          totalRemoved += lines.length;
        } else if (part.added) {
          currentChange.added.push(...lines);
          totalAdded += lines.length;
        } else {
          if (currentChange.removed.length > 0 || currentChange.added.length > 0) {
            blocks.push({
              type: 'changed',
              removed: [...currentChange.removed],
              added: [...currentChange.added]
            });
            currentChange = { removed: [], added: [] };
          }
          blocks.push({ type: 'unchanged', lines: lines });
        }
      }
      if (currentChange.removed.length > 0 || currentChange.added.length > 0) {
        blocks.push({
          type: 'changed',
          removed: [...currentChange.removed],
          added: [...currentChange.added]
        });
      }

      if (diffSummaryBadge) {
        if (totalAdded === 0 && totalRemoved === 0) {
          diffSummaryBadge.textContent = '两份文本完全一致';
        } else {
          diffSummaryBadge.textContent = `+${totalAdded} 行 / -${totalRemoved} 行`;
        }
      }

      if (viewMode === 'split') {
        // 双栏渲染
        let html = `
          <div class="diff-container split">
            <div class="diff-header-col left" style="grid-column: span 2;">原版本 (含删除)</div>
            <div class="diff-header-col right" style="grid-column: span 2;">修改后 (含新增)</div>
        `;
        let leftLineNum = 1;
        let rightLineNum = 1;

        for (let block of blocks) {
          if (block.type === 'unchanged') {
            for (let line of block.lines) {
              html += `
                <div class="diff-gutter left">${leftLineNum++}</div>
                <div class="diff-code left">${escapeHtml(line)}</div>
                <div class="diff-gutter right">${rightLineNum++}</div>
                <div class="diff-code right">${escapeHtml(line)}</div>
              `;
            }
          } else {
            let maxLen = Math.max(block.removed.length, block.added.length);
            for (let i = 0; i < maxLen; i++) {
              let leftLine = block.removed[i] !== undefined ? block.removed[i] : null;
              let rightLine = block.added[i] !== undefined ? block.added[i] : null;

              if (leftLine !== null && rightLine !== null) {
                let charDiff = Diff.diffChars(leftLine, rightLine, options);
                let leftHtml = '';
                let rightHtml = '';
                for (let cp of charDiff) {
                  let esc = escapeHtml(cp.value);
                  if (cp.removed) {
                    leftHtml += `<span class="char-delete">${esc}</span>`;
                  } else if (cp.added) {
                    rightHtml += `<span class="char-insert">${esc}</span>`;
                  } else {
                    leftHtml += esc;
                    rightHtml += esc;
                  }
                }
                html += `
                  <div class="diff-gutter left">${leftLineNum++}</div>
                  <div class="diff-code left diff-row-modify-left">${leftHtml}</div>
                  <div class="diff-gutter right">${rightLineNum++}</div>
                  <div class="diff-code right diff-row-modify-right">${rightHtml}</div>
                `;
              } else if (leftLine !== null) {
                html += `
                  <div class="diff-gutter left">${leftLineNum++}</div>
                  <div class="diff-code left diff-row-delete">${escapeHtml(leftLine)}</div>
                  <div class="diff-gutter right"></div>
                  <div class="diff-code right empty-line"></div>
                `;
              } else if (rightLine !== null) {
                html += `
                  <div class="diff-gutter left"></div>
                  <div class="diff-code left empty-line"></div>
                  <div class="diff-gutter right">${rightLineNum++}</div>
                  <div class="diff-code right diff-row-insert">${escapeHtml(rightLine)}</div>
                `;
              }
            }
          }
        }
        html += '</div>';
        diffOutput.innerHTML = html;
      } else {
        // 单栏渲染
        let html = `
          <div class="diff-container inline">
            <div class="diff-header-col gutter-title">原行号</div>
            <div class="diff-header-col gutter-title" style="border-right: 1px solid var(--line);">新行号</div>
            <div class="diff-header-col content-title">内容 (单栏合并)</div>
        `;
        let leftLineNum = 1;
        let rightLineNum = 1;

        for (let block of blocks) {
          if (block.type === 'unchanged') {
            for (let line of block.lines) {
              html += `
                <div class="diff-gutter left">${leftLineNum++}</div>
                <div class="diff-gutter right">${rightLineNum++}</div>
                <div class="diff-code">${escapeHtml(line)}</div>
              `;
            }
          } else {
            for (let line of block.removed) {
              html += `
                <div class="diff-gutter left">${leftLineNum++}</div>
                <div class="diff-gutter right"></div>
                <div class="diff-code diff-row-delete">${escapeHtml(line)}</div>
              `;
            }
            for (let line of block.added) {
              html += `
                <div class="diff-gutter left"></div>
                <div class="diff-gutter right">${rightLineNum++}</div>
                <div class="diff-code diff-row-insert">${escapeHtml(line)}</div>
              `;
            }
          }
        }
        html += '</div>';
        diffOutput.innerHTML = html;
      }
    }

    function renderTokenDiff(diffResult, viewMode, tokenType) {
      const diffOutput = document.getElementById('diffOutput');
      const diffSummaryBadge = document.getElementById('diffSummaryBadge');

      let addCount = 0;
      let delCount = 0;
      for (let part of diffResult) {
        if (part.added) addCount += part.value.length;
        if (part.removed) delCount += part.value.length;
      }
      if (diffSummaryBadge) {
        const unit = tokenType === 'word' ? '词' : '字';
        if (addCount === 0 && delCount === 0) {
          diffSummaryBadge.textContent = '两份文本完全一致';
        } else {
          diffSummaryBadge.textContent = `+${addCount} ${unit} / -${delCount} ${unit}`;
        }
      }

      let html = '<div class="diff-container token-view">';

      if (viewMode === 'split') {
        let leftHtml = '';
        let rightHtml = '';

        for (let part of diffResult) {
          let esc = escapeHtml(part.value);
          if (part.removed) {
            leftHtml += `<span class="char-delete">${esc}</span>`;
          } else if (part.added) {
            rightHtml += `<span class="char-insert">${esc}</span>`;
          } else {
            leftHtml += esc;
            rightHtml += esc;
          }
        }
        html += `
          <div class="diff-token-pane left">
            <div class="pane-title">原文本（高亮删除）</div>
            <pre>${leftHtml}</pre>
          </div>
          <div class="diff-token-pane right">
            <div class="pane-title">修改后文本（高亮新增）</div>
            <pre>${rightHtml}</pre>
          </div>
        `;
      } else {
        let inlineHtml = '';
        for (let part of diffResult) {
          let esc = escapeHtml(part.value);
          if (part.removed) {
            inlineHtml += `<span class="char-delete">${esc}</span>`;
          } else if (part.added) {
            inlineHtml += `<span class="char-insert">${esc}</span>`;
          } else {
            inlineHtml += esc;
          }
        }
        html += `
          <div class="diff-token-pane">
            <div class="pane-title">比对内容 (单栏混排)</div>
            <pre style="padding: 10px 0;">${inlineHtml}</pre>
          </div>
        `;
      }

      html += '</div>';
      diffOutput.innerHTML = html;
    }

    function importFile(targetId, input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById(targetId).value = e.target.result;
        updateTextStats(targetId);
        performDiff();
        input.value = '';
        showToast('文件导入成功');
      };
      reader.readAsText(file);
    }

    function setupDragAndDrop(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('dragover', (e) => {
        e.preventDefault();
        el.style.background = 'color-mix(in srgb, var(--accent) 8%, transparent)';
      });
      el.addEventListener('dragleave', (e) => {
        e.preventDefault();
        el.style.background = '';
      });
      el.addEventListener('drop', (e) => {
        e.preventDefault();
        el.style.background = '';
        const file = e.dataTransfer.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            el.value = event.target.result;
            updateTextStats(id);
            performDiff();
            showToast('拖拽文件加载成功');
          };
          reader.readAsText(file);
        }
      });
    }

    // 全局快捷键 Ctrl+Enter 立即比对
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        performDiff();
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      setupDragAndDrop('originalText');
      setupDragAndDrop('modifiedText');
    });
  </script>
</body>
</html>
